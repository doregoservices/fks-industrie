App.logoSave=async()=>{const f=$('#stLogo').files&&$('#stLogo').files[0];if(!f)return toast('Choisissez d’abord une image','bad');
  const shrink=dUrl=>new Promise(res=>{try{const img=new Image();img.onload=()=>{try{const sc=Math.min(1,256/Math.max(1,img.height||256));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round((img.width||256)*sc));c.height=Math.max(1,Math.round((img.height||256)*sc));
    const g=c.getContext&&c.getContext('2d');if(!g)return res(dUrl);g.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'));}catch(e){res(dUrl);}};
    img.onerror=()=>res(dUrl);img.src=dUrl;}catch(e){res(dUrl);}});
  let dataUrl=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(f);});
  if(!/^data:image\/(png|jpe?g);base64,/.test(dataUrl||''))return toast('Format non supporté — utilisez PNG ou JPG','bad');
  if(f.size>300000||dataUrl.length>420000)dataUrl=await shrink(dataUrl);
  if(dataUrl.length>420000)return toast('Image trop lourde même après réduction — essayez un logo plus simple','bad');
  await setSetting('company',{name:(SETS.company||{}).name||'FKS Industrie',logo:dataUrl});
  toast('Logo enregistré ✅ (visible dans l’app, les emails et les exports Excel)','ok');render();};

async function submitSalesPoint(aid,aname,date,lines,pay_mode,client){
  const total=lines.reduce((s,l)=>s+l.qty*l.price,0);
  let replaced=0,note='';
  if(navigator.onLine){
    try{
      const pend=await DB.list('pending_entries');
      for(const m of pend.filter(p=>p.status==='pending'&&p.source_type==='sales'&&(p.payload||{}).agent_id===aid&&(p.payload||{}).date===date)){
        await DB.update('pending_entries',m.id,{status:'replaced'});replaced++;
      }
      const val=await DB.list('sales');
      if(val.some(x=>x.agent_id===aid&&x.date===date))note='Complément : un point a déjà été validé pour cette date.';
    }catch(e){}
  }
  const res=await formSend('sales',aname,{date:date,agent_id:aid,agent_name:aname,lines:lines,total:total,pay_mode:pay_mode,client:client||'',note:note});
  return{total:total,replaced:replaced,complement:!!note,offline:!!res.offline};
}
App.fSend=async(aid,aname)=>{
  const prods=await DB.list('products');
  const lines=[];prods.forEach(p=>{const q=Number(($('#fq_'+p.id)||{}).value)||0;if(q>0)lines.push({product_id:p.id,name:p.name,qty:q,price:Number(p.price)||0});});
  if(!lines.length)return toast('Choisissez au moins un produit','bad');
  const r=await submitSalesPoint(aid,aname,$('#fD').value||todayISO(),lines,App._pay,$('#fClient')?$('#fClient').value:'');
  formOK('Point du '+dFR($('#fD').value||todayISO())+' : '+money(r.total),
    (r.replaced?'Votre envoi précédent (non validé) a été remplacé. ':'')
    +(r.complement?'Nota : un point était déjà validé pour cette date, celui-ci sera traité comme complément. ':'')
    +(r.offline?'Réseau indisponible : gardé sur le téléphone, envoi automatique dès le retour du réseau.':'Le gestionnaire va valider votre saisie.'));
};

async function dayStatus(D){
  const pend=(await DB.list('pending_entries',{eq:{status:'pending'}})).filter(p=>p.source_type==='sales'&&(p.payload||{}).date===D);
  const sales=(await DB.list('sales')).filter(s=>s.date===D);
  const logs=(await DB.list('email_log')).filter(l=>l.kind==='daily'&&l.ref===D);
  const sent=logsWith(logs,'sent').length>0;
  const update=logsWith(logs,'update_pending').length>0;
  return{pending:pend.length,sales:sales,sent:sent,update:update,complete:pend.length===0&&sales.length>0};
}
function logsWith(logs,st){return logs.filter(l=>l.status===st);}
function dayBadge(d){
  if(!d)return'';
  if(d.complete&&d.sent&&d.update)return'<span class="badge b-wait">complet · ✉️ envoyé puis complété — à renvoyer</span>';
  if(d.complete&&d.sent)return'<span class="badge b-ok">complet · ✉️ envoyé au boss</span>';
  if(d.complete)return'<span class="badge b-wait">complet · point à envoyer</span>';
  if(d.pending)return'<span class="badge b-no">'+d.pending+' vente(s) en attente de validation</span>';
  return'<span class="mut">aucune vente saisie</span>';
}

async function emailSend(subject,html,attachment){
  const E=SETS.email||{};
  if(CFG.mode!=='supabase')throw new Error('L\'envoi d\'emails nécessite le mode en ligne (Supabase) — sinon utilisez « ✉️ Préparer l\'email »');
  if(!E.boss)throw new Error('Email du boss manquant — Réglages → 📧 Envoi des rapports');
  if(!E.key)throw new Error('Clé d\'envoi REPORT_KEY manquante — Réglages → 📧 Envoi des rapports');
  let r;
  try{r=await fetch(Supa.base()+'/functions/v1/send-report',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.anon,Authorization:'Bearer '+CFG.anon,'x-report-key':E.key},body:JSON.stringify({to:E.boss,subject,html,attachment:attachment||null})});}
  catch(e){throw new Error('Fonction d\'envoi injoignable — projet Supabase en pause (relancez-le dans la console) ou URL incorrecte');}
  let j=null;try{j=await r.json();}catch(e){}
  if(r.ok)return j;
  const msg=String((j&&(j.error||j.msg))||'');
  if(r.status===404||/not found|non déploy/i.test(msg))throw new Error('Fonction « send-report » NON DÉPLOYÉE sur votre projet — Supabase → Edge Functions → New Function (voir GUIDE.md § 📧, 10 min)');
  if(r.status===401){
    if(/jwt/i.test(msg))throw new Error('Accès refusé (JWT) — faites Ctrl+F5 et réessayez');
    throw new Error('Clé d\'envoi REPORT_KEY invalide — elle doit être IDENTIQUE dans les Secrets de la fonction Supabase et dans Réglages → 📧');
  }
  throw new Error(msg||('Erreur '+r.status));
}

/* ================= COMPTE D'EXPLOITATION MENSUEL ================= */
function acctGroupOf(key){
  const l=(SETS.sage_accounts||[]).filter(x=>x.key===key)[0];
  if(l&&l.group)return l.group;
  if(key==='salaires'||key==='charges_sociales')return 'personnel';
  return 'services';
}
function assetMonthlyDep(a,period){
  if(a&&a.active===false)return 0;
  const startM=String(a.acq_date||'').slice(0,7);
  if(startM>period)return 0;
  const life=Math.max(1,Number(a.life_years||1));
  const total=Math.max(0,Number(a.cost||0)-Number(a.salvage||0));
  if(total<=0)return 0;
  const per=Math.round(total/(life*12));
  const before=assetCumulDep(a,monthAdd(period,-1));
  if(before>=total)return 0;
  return Math.min(per,total-before);
}
function assetCumulDep(a,uptoPeriod){
  if(a&&a.active===false)return 0;
  const startM=String(a.acq_date||'').slice(0,7);
  if(startM>uptoPeriod)return 0;
  const life=Math.max(1,Number(a.life_years||1));
  const total=Math.max(0,Number(a.cost||0)-Number(a.salvage||0));
  let months=0,m=startM;
  while(m<=uptoPeriod&&months<life*12){months++;m=monthAdd(m,1);}
  return Math.min(Math.round(total/(life*12)*months),total);
}
function impotBucket(e){const t=((e.label||'')+' '+(e.category||'')).toLowerCase();
  if(t.indexOf('patente')>=0)return 'Patente (taxe professionnelle)';
  if(/\btee\b/.test(t)||t.indexOf('enlev')>=0||t.indexOf('ordures')>=0)return 'TEE (taxe enlèvement ordures)';
  if(/\bits/.test(t)||t.indexOf('icts')>=0||t.indexOf('traitements')>=0)return 'ITS (impôt sur traitements et salaires)';
  return null;}
async function computeIncome(period){
  const start=period+'-01';
  const end=monthAdd(period,1)+'-01';
  const prevP=monthAdd(period,-1);
  const prevStart=prevP+'-01';
  const inM=d=>d>=start&&d<end;
  const[pur,roast,prod,sales,adj,prods,cash,pkItems,pkEnt,assets,transf,ctypes]=await Promise.all([
    DB.list('purchases'),DB.list('roastings'),DB.list('productions'),DB.list('sales'),DB.list('adjustments'),
    DB.list('products'),DB.list('cash_entries'),DB.list('packaging_items'),DB.list('packaging_entries'),DB.list('assets'),DB.list('transformations'),DB.list('coffee_types')]);
  const runs=await DB.list('pay_runs',{eq:{period:period}});
  const run=runs[0];
  const slips=run?await DB.list('pay_slips',{eq:{run_id:run.id}}):[];
  const cmpVertAt=D=>{let a=0,q=0;pur.filter(p=>p.date<=D).forEach(p=>{a+=Number(p.amount||0);q+=Number(p.qty_kg||0);});return q>0?a/q:0;};
  const greenKgAt=D=>pur.filter(p=>p.date<=D).reduce((a,p)=>a+Number(p.qty_kg||0),0)-roast.filter(r=>r.date<=D).reduce((a,r)=>a+Number(r.green_in||0),0)+adj.filter(x=>x.level==='green'&&x.date<=D).reduce((a,x)=>a+Number(x.qty||0),0);
  const roastedKgAt=D=>roast.filter(r=>r.date<=D).reduce((a,r)=>a+Number(r.roasted_out||0),0)-prod.filter(p=>p.date<=D).reduce((a,p)=>a+Number(p.roasted_used||0),0)-transf.filter(t=>t.date<=D).reduce((a,t)=>a+Number(t.roasted_used||0),0)+adj.filter(x=>x.level==='roasted'&&x.date<=D).reduce((a,x)=>a+Number(x.qty||0),0);
  const typeQtyAt=(tid,name,D)=>{let u=0;
    transf.filter(t=>t.date<=D).forEach(t=>(t.lines||[]).forEach(l=>{if(l.type_id===tid||l.name===name)u+=Number(l.qty||0);}));
    prod.filter(p=>p.date<=D).forEach(p=>(p.type_lines||[]).forEach(l=>{if(l.type_id===tid||l.name===name)u-=Number(l.qty||0);}));
    adj.filter(x=>x.level==='type'&&x.date<=D&&(x.type_id===tid||x.name===name)).forEach(x=>u+=Number(x.qty||0));
    return u;};
  const pfUnitsAt=(pid,name,D)=>{let u=0;
    prod.filter(p=>p.date<=D).forEach(p=>(p.lines||[]).forEach(l=>{if(l.product_id===pid||l.name===name)u+=Number(l.qty||0);}));
    sales.filter(s2=>s2.date<=D).forEach(s2=>(s2.lines||[]).forEach(l=>{if(l.product_id===pid||l.name===name)u-=Number(l.qty||0);}));
    adj.filter(x=>x.level==='product'&&x.date<=D&&(x.product_id===pid||x.name===name)).forEach(x=>u+=Number(x.qty||0));
    return u;};
  const cmpPkAt=(id,D)=>{let v=0,q=0;pkEnt.filter(e=>e.item_id===id&&e.type==='in'&&e.date<=D).forEach(e=>{v+=Number(e.qty||0)*Number(e.unit_cost||0);q+=Number(e.qty||0);});return q>0?v/q:0;};
  const pkQtyAt=(id,D)=>pkEnt.filter(e=>e.item_id===id&&e.date<=D).reduce((a,e)=>a+(e.type==='in'?1:-1)*Number(e.qty||0),0);
  const inPer=(d,per)=>d>=per+'-01'&&d<monthAdd(per,1)+'-01';
  const semiCostFor=per=>{let v=0,q=0;
    transf.filter(t=>inPer(t.date,per)).forEach(t=>{v+=Number(t.roasted_used||0)*cmpVertAt(end);(t.lines||[]).forEach(l=>q+=Number(l.qty||0));});
    return q>0?v/q:0;};
  const pfCostFor=per=>{let g=prod.filter(p=>inPer(p.date,per)).reduce((a,p)=>a+Number(p.roasted_used||0)*cmpVertAt(end),0);
    const sc=semiCostFor(per);
    prod.filter(p=>inPer(p.date,per)).forEach(p=>(p.type_lines||[]).forEach(l=>g+=Number(l.qty||0)*sc));
    let pv=0;pkEnt.filter(e=>e.type==='out'&&inPer(e.date,per)).forEach(e=>pv+=Number(e.qty||0)*cmpPkAt(e.item_id,end));
    let u=0;prod.filter(p=>inPer(p.date,per)).forEach(p=>(p.lines||[]).forEach(l=>u+=Number(l.qty||0)));
    return u>0?(g+pv)/u:0;};
  const pfCost=pfCostFor(period),pfCostPrev=pfCostFor(prevP);
  /* --- PRODUITS --- */
  const ventes=sales.filter(s2=>inM(s2.date)).reduce((a,x)=>a+Number(x.total||0),0);
  const pfSIv=Math.round(prods.reduce((a,p)=>a+pfUnitsAt(p.id,p.name,prevStart)*pfCostPrev,0));
  const pfSFv=Math.round(prods.reduce((a,p)=>a+pfUnitsAt(p.id,p.name,end)*pfCost,0));
  const dPF=pfSFv-pfSIv;
  const semiCost=semiCostFor(period),semiCostPrev=semiCostFor(prevP);
  const semiSIv=Math.round(ctypes.reduce((a,t)=>a+typeQtyAt(t.id,t.name,prevStart)*semiCostPrev,0));
  const semiSFv=Math.round(ctypes.reduce((a,t)=>a+typeQtyAt(t.id,t.name,end)*semiCost,0));
  const dSemi=semiSFv-semiSIv;
  const produitsTot=ventes+dPF+dSemi;
  /* --- CHARGE 1 : achats consommés (via inventaire) --- */
  const achV=pur.filter(p=>inM(p.date));
  const achVertAmt=achV.reduce((a,p)=>a+Number(p.amount||0),0),achVertKg=achV.reduce((a,p)=>a+Number(p.qty_kg||0),0);
  const achEmb=pkEnt.filter(e=>e.type==='in'&&inM(e.date)).reduce((a,e)=>a+Number(e.amount||0),0);
  const gSI=greenKgAt(prevStart),gSF=greenKgAt(end);
  const gSIv=Math.round(gSI*cmpVertAt(prevStart)),gSFv=Math.round(gSF*cmpVertAt(end));
  const consVert=gSIv+achVertAmt-gSFv;
  const embSIv=Math.round(pkItems.reduce((a,it)=>a+pkQtyAt(it.id,prevStart)*cmpPkAt(it.id,prevStart),0));
  const embSFv=Math.round(pkItems.reduce((a,it)=>a+pkQtyAt(it.id,end)*cmpPkAt(it.id,end),0));
  const consEmb=embSIv+achEmb-embSFv;
  /* --- CHARGES directes par grandes masses (caisse imputable) --- */
  const SKIP=['achat_vert','emballages','treso_caisse','treso_momo','apport'];
  const G={services:{},personnel:0,impots:{},hors:0};
  cash.filter(e=>inM(e.date)&&e.type==='out'&&e.imputable!==false).forEach(e=>{
    if(SKIP.indexOf(e.category)>=0)return;
    const g=acctGroupOf(e.category);
    const v=Number(e.amount||0);
    if(g==='impots'){const bk=impotBucket(e)||sagLbl(e.category);G.impots[bk]=(G.impots[bk]||0)+v;}
    else if(g==='personnel')G.personnel+=v;
    else if(g==='hors')G.hors+=v;
    else G.services[e.category]=(G.services[e.category]||0)+v;
  });
  const servicesTot=Object.keys(G.services).reduce((a,k)=>a+G.services[k],0);
  const XLINES=(SETS.extra_lines||[]).filter(x=>x.period===period);
  const personXL=XLINES.filter(x=>x.section==='personnel').map(x=>({id:x.id,label:x.label,amount:Number(x.amount)||0,custom:true}));
  const impotsCustom=XLINES.filter(x=>x.section==='impots').map(x=>({id:x.id,label:x.label,amount:Number(x.amount)||0,custom:true}));
  const impotsTot=Object.keys(G.impots).reduce((a,k)=>a+G.impots[k],0)+impotsCustom.reduce((a,x)=>a+x.amount,0);
  const impotsRows=Object.keys(G.impots).map(k=>({label:k,amount:G.impots[k]})).concat(impotsCustom);
  /* --- CHARGE 2 : personnel (paie si clôturée, sinon caisse) --- */
  let personnel={brut:0,pat:0,fdfp:0,total:0,fallback:false,extra:0,det:null,custom:personXL};
  const salairesCash=(await DB.list('cash_entries')).filter(e=>inM(e.date)&&e.type==='out'&&e.category==='salaires').reduce((a,e)=>a+Number(e.amount||0),0);
  if(slips.length){
    personnel.brut=slips.reduce((a,x)=>a+Number(x.brut_ap||0),0);
    personnel.pat=slips.reduce((a,x)=>a+Number(x.cnps_employer||0),0);
    personnel.fdfp=slips.reduce((a,x)=>a+Number(x.fdfp||0),0);
    personnel.total=slips.reduce((a,x)=>a+Number(x.cout_employeur||x.brut_ap||0),0);
    personnel.det={cnpsS:slips.reduce((a,x)=>a+Number(x.cnps||0),0),
      cmuS:slips.reduce((a,x)=>a+Number(x.cmu||0),0),
      itsS:slips.reduce((a,x)=>a+Number((x.its!=null?x.its:x.irpp)||0),0),
      net:slips.reduce((a,x)=>a+Number(x.net||0),0),
      primes:slips.reduce((a,x)=>a+Number(x.bonus||0),0)};
    personnel.extra=Math.max(0,G.personnel-salairesCash); // charges sociales payées manuellement via caisse
    personnel.total+=personnel.extra;
  }else if(G.personnel>0){
    personnel={brut:G.personnel,pat:0,fdfp:0,total:G.personnel,fallback:true,extra:0,det:null,custom:personXL};
  }
  personnel.total+=(personnel.custom||[]).reduce((a,x)=>a+x.amount,0);
  /* --- CHARGE 3 : dotations aux amortissements --- */
  const dotations=assets.reduce((a,x)=>a+assetMonthlyDep(x,period),0);
  const assetsRows=assets.map(a=>({name:a.name,category:a.category||'',cost:Number(a.cost||0),dep:assetMonthlyDep(a,period),cumul:assetCumulDep(a,period),vnc:Number(a.cost||0)-assetCumulDep(a,period)}));
  const cumulTot=assetsRows.reduce((a,x)=>a+x.cumul,0),vncTot=assetsRows.reduce((a,x)=>a+x.vnc,0);
  /* --- TOTAUX --- */
  const chargesTot=consVert+consEmb+servicesTot+personnel.total+impotsTot+dotations;
  const resultat=Math.round(produitsTot-chargesTot);
  const marge=ventes>0?100*resultat/ventes:0;
  const isRate=Number((SETS.exploitation||{}).is_rate!=null?(SETS.exploitation||{}).is_rate:25);
  const isBenef=(isRate>0&&resultat>0)?Math.round(resultat*isRate/100):0;
  const resultatNet=resultat-isBenef;
  const ebe=resultat+dotations;              // excédent brut d'exploitation (EBITDA)
  const caf=resultatNet+dotations;           // capacité d'autofinancement (cash-flow)
  /* --- TRÉSORERIE RÉELLE --- */
  const tr={};
  cash.filter(e=>inM(e.date)).forEach(e=>{const k=(e.account==='momo'?'momo':'cash');
    tr[k]=tr[k]||{in:0,out:0,od:0};const v=Number(e.amount||0);
    if(e.imputable===false)tr[k].od+=(e.type==='in'?v:-v);else tr[k][e.type==='in'?'in':'out']+=v;});
  const encaiss=(tr.cash?tr.cash.in:0)+(tr.momo?tr.momo.in:0);
  const decaiss=(tr.cash?tr.cash.out:0)+(tr.momo?tr.momo.out:0);
  const fluxTreso=encaiss-decaiss+((tr.cash?tr.cash.od:0)+(tr.momo?tr.momo.od:0));
  const odNet=(tr.cash?tr.cash.od:0)+(tr.momo?tr.momo.od:0);
  const creances=sales.filter(s2=>inM(s2.date)&&s2.pay_mode==='credit'&&s2.credit_status==='due').reduce((a,x)=>a+Number(x.total||0),0);
  const roastIn=roast.filter(r=>inM(r.date)).reduce((a,r)=>a+Number(r.green_in||0),0);
  const roastOut=roast.filter(r=>inM(r.date)).reduce((a,r)=>a+Number(r.roasted_out||0),0);
  /* --- ANALYTIQUE PAR PRODUIT --- */
  const roastCostKg=roastOut>0?cmpVertAt(end)*roastIn/roastOut:cmpVertAt(end);
  const unitCostOf=p=>{let c=0;
    const sc=semiCost>0?semiCost:roastCostKg;
    if((p.recipes||[]).length)(p.recipes).forEach(r=>c+=Number(r.qty||0)*sc);
    else c+=Number(p.weight_g||0)/1000*roastCostKg;
    (p.packaging||[]).forEach(b=>c+=Number(b.qty||0)*cmpPkAt(b.pack_id,end));
    return c;};
  const soldBy={};
  sales.filter(s3=>inM(s3.date)).forEach(s3=>(s3.lines||[]).forEach(l=>{const k=l.product_id||l.name;if(!soldBy[k])soldBy[k]={name:l.name,qty:0,ca:0};soldBy[k].qty+=Number(l.qty||0);soldBy[k].ca+=Number(l.qty||0)*Number(l.price||0);}));
  const prodAnalysis=prods.map(p=>{const sl=soldBy[p.id]||soldBy[p.name]||{qty:0,ca:0};
    const cu=unitCostOf(p);const cost=sl.qty*cu;
    return{name:p.name,qty:sl.qty,ca:Math.round(sl.ca),cu:cu,cost:Math.round(cost),marge:Math.round(sl.ca-cost)};});
  const paTot=prodAnalysis.reduce((a,r)=>({q:a.q+r.qty,ca:a.ca+r.ca,cost:a.cost+r.cost,m:a.m+r.marge}),{q:0,ca:0,cost:0,m:0});
  /* --- COÛT DE REVIENT COMPLET : quote-part des charges indirectes --- */
  const producedBy={};prod.filter(x=>inM(x.date)).forEach(x=>(x.lines||[]).forEach(l=>{const k=l.product_id||l.name;producedBy[k]=(producedBy[k]||0)+Number(l.qty||0);}));
  const unitsProduced=Object.keys(producedBy).reduce((a,k)=>a+producedBy[k],0);
  const indirectTot=(personnel.total||0)+(servicesTot||0)+(impotsTot||0)+(dotations||0);
  const qpUnit=unitsProduced>0?indirectTot/unitsProduced:0;
  prodAnalysis.forEach(r=>{r.qp=qpUnit;r.cuFull=r.cu+qpUnit;r.costFull=Math.round(r.qty*r.cuFull);r.margeNette=r.ca-r.costFull;});
  paTot.costFull=prodAnalysis.reduce((a,r)=>a+r.costFull,0);
  paTot.mN=prodAnalysis.reduce((a,r)=>a+r.margeNette,0);
  return{period:period,ventes:ventes,dPF:dPF,produitsTot:produitsTot,prodAnalysis:prodAnalysis,paTot:paTot,
    indirectTot:indirectTot,qpUnit:qpUnit,unitsProduced:unitsProduced,
    achVertAmt:achVertAmt,achVertKg:achVertKg,achEmb:achEmb,
    gSI:gSI,gSF:gSF,gSIv:gSIv,gSFv:gSFv,cmpVertSI:cmpVertAt(prevStart),cmpVertSF:cmpVertAt(end),consVert:consVert,
    embSIv:embSIv,embSFv:embSFv,consEmb:consEmb,
    services:G.services,servicesTot:servicesTot,
    personnel:personnel,impots:G.impots,impotsRows:impotsRows,impotsTot:impotsTot,hors:G.hors,
    dotations:dotations,assetsRows:assetsRows,cumulTot:cumulTot,vncTot:vncTot,
    chargesTot:chargesTot,resultat:resultat,marge:marge,isRate:isRate,isBenef:isBenef,
    resultatNet:resultatNet,ebe:ebe,caf:caf,
    encaiss:encaiss,decaiss:decaiss,fluxTreso:fluxTreso,odNet:odNet,creances:creances,tr:tr,
    roastIn:roastIn,roastOut:roastOut,perte:roastIn-roastOut,rendement:roastIn>0?100*roastOut/roastIn:0,
    slips:slips,run:run,
    pfSIv:pfSIv,pfSFv:pfSFv,pfCost:pfCost,semiCost:semiCost,semiSIv:semiSIv,semiSFv:semiSFv,dSemi:dSemi,
    transfMade:transf.filter(t=>inM(t.date)).reduce((a,t)=>(t.lines||[]).reduce((x,l)=>x+Number(l.qty||0),0)+a,0),
    transfUsed:transf.filter(t=>inM(t.date)).reduce((a,t)=>a+Number(t.roasted_used||0),0),
    roastMadeM:roast.filter(r=>inM(r.date)).reduce((a,r)=>a+Number(r.roasted_out||0),0),
    roastUsedM:roast.filter(r=>inM(r.date)).reduce((a,r)=>a+Number(r.green_in||0),0),
    roastSIM:roastedKgAt(prevStart),roastSFM:roastedKgAt(end),
    typeRows:ctypes.map(t=>({name:t.name,si:typeQtyAt(t.id,t.name,prevStart),sf:typeQtyAt(t.id,t.name,end),
      mMade:transf.filter(x=>inM(x.date)).reduce((a,x)=>a+((x.lines||[]).filter(l=>l.type_id===t.id||l.name===t.name).reduce((b,l)=>b+Number(l.qty||0),0)),0),
      mUsed:prod.filter(x=>inM(x.date)).reduce((a,x)=>a+((x.type_lines||[]).filter(l=>l.type_id===t.id||l.name===t.name).reduce((b,l)=>b+Number(l.qty||0),0)),0)})),
    pfRows:prods.map(p=>({name:p.name,si:pfUnitsAt(p.id,p.name,prevStart),sf:pfUnitsAt(p.id,p.name,end)})),
    pkRows:pkItems.map(it=>({name:it.name,unit:it.unit,si:pkQtyAt(it.id,prevStart),sf:pkQtyAt(it.id,end)}))};
}

    ['Décaissements espèces',-((inc.tr.cash||{}).out||0)],
    ['Décaissements Mobile Money',-((inc.tr.momo||{}).out||0)],
    ['Opérations avec la direction (OD)',inc.odNet],
    [{v:'FLUX NET DE TRÉSORERIE',__style:1},{v:inc.fluxTreso,__style:1}],
    [],
    ['ÉCART RÉSULTAT ↔ TRÉSORERIE','FCFA'],
    ['Créances clients en cours',inc.creances],
    ['Dotations non décaissées',inc.dotations],
    ['Stocks : réglé − consommé',(inc.achVertAmt+inc.achEmb)-(inc.consVert+inc.consEmb)],
    ['Impôt bénéfices estimé non décaissé',inc.isBenef]];
  sheets.push({name:'Cash-flow',rows:cfSh,widths:[44,16]});
  const hSh=[['COMPARATIF 12 MOIS — au '+monthLabel(inc.period)],[],['MOIS','VENTES','RÉSULTAT NET','CAF','FLUX TRÉSORERIE']];
  let tV=0,tN=0,tC=0,tF=0;
  for(let hi=11;hi>=0;hi--){const hp=monthAdd(inc.period,-hi);const c=hi===0?inc:await computeIncome(hp);
    hSh.push([monthLabel(hp),c.ventes,c.resultatNet,c.caf,c.fluxTreso]);tV+=c.ventes;tN+=c.resultatNet;tC+=c.caf;tF+=c.fluxTreso;}
  hSh.push([{v:'TOTAL 12 MOIS',__style:1},{v:tV,__style:1},{v:tN,__style:1},{v:tC,__style:1},{v:tF,__style:1}]);
  sheets.push({name:'12 mois',rows:hSh,widths:[18,16,16,14,18]});
  return buildXlsx(sheets);
}

async function monthlyDue(){
  if(Number(todayISO().slice(8,10))>5)return null;
  const prev=monthAdd(monthISO(),-1);
  const logs=await DB.list('email_log',{eq:{kind:'monthly'}});
  if(logs.some(l=>l.ref===prev&&l.status==='sent'))return null;
  if(logs.some(l=>l.ref===prev&&l.status==='failed'))return prev;
  return prev;
}

  +'<div class="kpi"><div class="t">VNC à fin '+monthLabel(per)+'</div><div class="v">'+money(totCost-totCumul)+'</div></div></div>'
  +'<div class="tblwrap"><table class="tbl"><thead><tr><th>Immobilisation</th><th>Acquisition</th><th class="r">Coût</th><th class="r">Durée</th><th class="r">Dotation/mois</th><th class="r">Cumulé</th><th class="r">VNC</th><th></th></tr></thead><tbody>'
  +rows.map(a=>'<tr><td><b>'+esc(a.name)+'</b><div class="mut" style="font-size:11px">'+esc(a.category||'')+(Number(a.salvage)?' · résiduel '+money(a.salvage):'')+'</div></td><td>'+dFR(a.acq_date)+'</td><td class="r">'+money(a.cost)+'</td><td class="r">'+num2(a.life_years)+' ans</td><td class="r"><b>'+money(a.dep)+'</b></td><td class="r">'+money(a.cumul)+'</td><td class="r">'+money(Number(a.cost)-a.cumul)+'</td>'
   +'<td style="white-space:nowrap"><button class="btn sm sec" onclick="App.assetForm(\''+a.id+'\')">✎</button> <button class="btn sm sec" onclick="App.delRow(\'assets\',\''+a.id+'\')">✕</button></td></tr>').join('')
  +(rows.length?'':'<tr><td colspan="8" class="empty"><span class="ic">🏗️</span>Aucune immobilisation — ajoutez le torréfacteur, les moulins, véhicules…</td></tr>')
  +'</tbody>'+(rows.length?'<tfoot><tr><td>TOTAL</td><td></td><td class="r">'+money(totCost)+'</td><td></td><td class="r">'+money(totDep)+'</td><td class="r">'+money(totCumul)+'</td><td class="r">'+money(totCost-totCumul)+'</td><td></td></tr></tfoot>':'')+'</table></div></div>';
}
App.assetForm=async id=>{
  let a={name:'',category:'Matériel de production',acq_date:todayISO(),cost:0,salvage:0,life_years:5,active:true,note:''};
  if(id)a=(await DB.list('assets',{eq:{id:id}}))[0]||a;
  modal(id?'Modifier l\'immobilisation':'Nouvelle immobilisation',
    fld('Nom','<input id="asN" value="'+esc(a.name)+'" placeholder="ex : Moulin à café Probat">')
    +'<div class="row">'+fld('Catégorie','<select id="asC">'+['Matériel de production','Véhicule','Bâtiment / local','Mobilier','Informatique','Autre'].map(c=>'<option'+(a.category===c?' selected':'')+'>'+c+'</option>').join('')+'</select>')
    +fld('Date d\'acquisition','<input id="asD" type="date" value="'+esc(a.acq_date||todayISO())+'">')+'</div>'
    +'<div class="row">'+fld('Coût d\'acquisition (FCFA)','<input id="asCo" type="number" inputmode="numeric">')+fld('Valeur résiduelle (FCFA)','<input id="asS" type="number" inputmode="numeric" value="'+(a.salvage||0)+'">')+fld('Durée d\'amortissement (années)','<input id="asL" type="number" inputmode="numeric" step="0.5" value="'+(a.life_years||5)+'">')+'</div>'
    +'<div class="help" id="asPrev"></div>',
    '<button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="App.assetSave(\''+(id||'')+'\')">Enregistrer</button>');
  $('#asCo').value=a.cost||'';
  const upd=()=>{const c=Number($('#asCo').value)||0,r=Number($('#asS').value)||0,y=Number($('#asL').value)||1;
    $('#asPrev').innerHTML='Dotation mensuelle : <b>'+money((c-r)/(y*12))+'</b> pendant '+num2(y*12)+' mois';};
  ['asCo','asS','asL'].forEach(i2=>$('#'+i2).addEventListener('input',upd));upd();
};
App.assetSave=async id=>{const rec={name:$('#asN').value.trim(),category:$('#asC').value,acq_date:$('#asD').value||todayISO(),cost:Number($('#asCo').value)||0,salvage:Number($('#asS').value)||0,life_years:Number($('#asL').value)||1,active:true,note:''};
  if(!rec.name||!rec.cost)return toast('Nom et coût obligatoires','bad');
  if(id)await DB.update('assets',id,rec);else await DB.insert('assets',rec);
  closeModal();toast('Immobilisation enregistrée','ok');render();};

/* ================= INITIALISATION ================= */
(function watchLogoFile(){try{const img=new Image();img.onload=()=>{S.hasLogoFile=true;$$('.brand .logo,.formhead .logo').forEach(el=>{if(!(SETS.company&&SETS.company.logo))el.innerHTML='<img src="logo.png" style="width:100%;height:100%;object-fit:contain;border-radius:9px">';});};img.src='logo.png';}catch(e){}})();
window.addEventListener('hashchange',()=>{try{if(S.hasLogoFile&&!(SETS.company&&SETS.company.logo))$$('.brand .logo,.formhead .logo').forEach(el=>{el.innerHTML='<img src="logo.png" style="width:100%;height:100%;object-fit:contain;border-radius:9px">';});}catch(e){}});
(async function init(){
  applyCfgFromUrl();
  setDbAdapter();
  try{
    if(CFG.mode==='supabase'&&SES&&SES.access_token){
      S.user={email:SES.email,name:(SES.email||'').split('@')[0]};
      await loadSettings();
      await outboxFlush();
    }else if(CFG.mode==='local'){
      await loadSettings();
    }else{
      await loadSettings().catch(()=>{});
    }
  }catch(e){console.warn('init',e);if(CFG.mode==='supabase'&&SES){SES=null;S.user=null;}}
  render();
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
