<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#6f4e37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FKS Industrie — CaféPro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
:root{
  --bg:#f6f1ea; --card:#ffffff; --ink:#2b211a; --mut:#8d7b6c; --pri:#6f4e37; --pri-d:#57392a;
  --acc:#d9a05f; --line:#ecdfd0; --ok:#1d7a4f; --okbg:#e5f4ec; --warn:#b7791f; --warnbg:#fcf3e2;
  --bad:#c0392b; --badbg:#fbe9e7; --info:#2b6cb0; --infobg:#e6f0fa; --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
a{color:var(--pri)}
h1,h2,h3{margin:0 0 10px}
h2{font-size:19px}h3{font-size:16px}
small,.mut{color:var(--mut)}
.topwrap{position:sticky;top:0;z-index:60;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(80,50,20,.06)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1060px;margin:0 auto}
.brand{font-weight:800;color:var(--pri);font-size:18px;display:flex;gap:9px;align-items:center;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--acc));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.brand .sub{font-size:10px;font-weight:600;color:var(--mut);display:block;margin-top:-3px}
.spacer{flex:1}
.userchip{font-size:13px;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:8px}
.nav{display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto;padding:0 14px 10px;max-width:1060px;margin:0 auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex-shrink:0;text-decoration:none;color:var(--mut);font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:99px;background:#f4ece2;border:1px solid transparent;white-space:nowrap}
.nav a.on{background:var(--pri);color:#fff}
.nav a .bdg{display:inline-block;min-width:18px;text-align:center;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 5px;margin-left:4px}
main{max-width:1060px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(90,60,30,.05)}
.card h2,.card h3{display:flex;align-items:center;gap:8px;justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.kpi .t{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kpi .v{font-size:19px;font-weight:800;margin-top:3px;color:var(--pri-d)}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--pri);color:#fff;border:none;border-radius:12px;padding:10px 16px;font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.sec{background:#f1e7da;color:var(--pri-d)}
.btn.danger{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.blk{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field span{font-size:12.5px;font-weight:700;color:var(--mut)}
input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fffdf9;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=radio],input[type=checkbox]{width:auto;accent-color:var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .field{flex:1;min-width:140px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid #f3eadd;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.b-ok{background:var(--okbg);color:var(--ok)}.b-wait{background:var(--warnbg);color:var(--warn)}.b-no{background:var(--badbg);color:var(--bad)}.b-info{background:var(--infobg);color:var(--info)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.empty .ic{font-size:34px;display:block;margin-bottom:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1.5px solid var(--line);background:#fff;color:var(--mut);font-weight:700;font-size:13.5px;padding:7px 14px;border-radius:99px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;background:#f4ece2;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--pri-d)}
.alert{border-radius:12px;padding:10px 13px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.al-warn{background:var(--warnbg);color:var(--warn)}.al-bad{background:var(--badbg);color:var(--bad)}.al-ok{background:var(--okbg);color:var(--ok)}.al-info{background:var(--infobg);color:var(--info)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.mwrap{position:fixed;inset:0;background:rgba(40,25,15,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:600px){.mwrap{align-items:center;padding:20px}}
.mcard{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px}
@media(min-width:600px){.mcard{border-radius:20px}}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mhead b{font-size:17px}
.mhead .x{border:none;background:#f4ece2;color:var(--pri-d);width:32px;height:32px;border-radius:99px;font-size:17px;cursor:pointer}
.mfoot{display:flex;gap:10px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.linerow{display:grid;grid-template-columns:1.6fr .7fr .9fr .9fr 34px;gap:7px;align-items:center;margin-bottom:7px}
@media(max-width:600px){.linerow{grid-template-columns:1.4fr .6fr .8fr 30px}.linerow .amt{display:none}}
.qtygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qcard{border:1.5px solid var(--line);border-radius:14px;padding:10px;background:#fffdf9}
.qcard .nm{font-size:13px;font-weight:700;min-height:34px}
.qcard .pr{font-size:11.5px;color:var(--mut)}
.stepper{display:flex;align-items:center;gap:6px;margin-top:7px}
.stepper button{width:34px;height:34px;border-radius:10px;border:none;background:var(--pri);color:#fff;font-size:19px;font-weight:800;cursor:pointer}
.stepper input{width:100%;text-align:center;font-weight:800;padding:6px}
.stepper .zero{background:#efe5d7;color:var(--mut)}
.formpage{min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.formhead{background:var(--pri);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px}
.formhead .logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px}
.formhead b{font-size:17px}.formhead small{opacity:.85;display:block}
.formbody{padding:16px 14px 40px;max-width:620px;margin:0 auto;width:100%}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.toggle button{padding:11px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:14px;cursor:pointer;color:var(--mut);font-family:inherit}
.toggle button.on.in{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.toggle button.on.out{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.biglist button{width:100%;text-align:left;margin-bottom:8px;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit}
.linkbox{background:#f4ece2;border:1.5px dashed var(--acc);border-radius:12px;padding:10px 12px;font-size:12.5px;word-break:break-all;font-family:monospace}
.stamp{background:var(--okbg);border:1.5px solid var(--ok);border-radius:16px;padding:18px;text-align:center;margin:20px 0}
.stamp .big{font-size:44px}
.slide{display:none}.slide.on{display:block}
.hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.payrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{font-size:12px;color:var(--mut)}
code.k{background:#f4ece2;padding:1px 7px;border-radius:6px;font-size:12px}
.listitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3eadd}
.listitem:last-child{border-bottom:none}
.avatar{width:38px;height:38px;border-radius:99px;background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media print{.topwrap,.nav,.btab,.noprint{display:none!important}body{background:#fff}}
.btab{display:none}
@media(max-width:768px){
  .nav{display:none}
  .btab{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:80;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 14px rgba(80,50,20,.09);padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px))}
  .btab a,.btab button{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--mut);font-size:10.5px;font-weight:700;background:none;border:none;font-family:inherit;padding:5px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btab .ic{font-size:21px;line-height:1}
  .btab .on{color:var(--pri)}
  main{padding:14px 14px 128px}
  #toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .mcard{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
</style>

"use strict";
var qrcodegen;
(function (qrcodegen) {
    /*---- QR Code symbol class ----*/
    /*
     * A QR Code symbol, which is a type of two-dimension barcode.
     * Invented by Denso Wave and described in the ISO/IEC 18004 standard.
     * Instances of this class represent an immutable square grid of dark and light cells.
     * The class provides static factory functions to create a QR Code from text or binary data.
     * The class covers the QR Code Model 2 specification, supporting all versions (sizes)
     * from 1 to 40, all 4 error correction levels, and 4 character encoding modes.
     *
     * Ways to create a QR Code object:
     * - High level: Take the payload data and call QrCode.encodeText() or QrCode.encodeBinary().
     * - Mid level: Custom-make the list of segments and call QrCode.encodeSegments().
     * - Low level: Custom-make the array of data codeword bytes (including
     *   segment headers and final padding, excluding error correction codewords),
     *   supply the appropriate version number, and call the QrCode() constructor.
     * (Note that all ways require supplying the desired error correction level.)
     */
    class QrCode {
        /*-- Constructor (low level) and fields --*/
        // Creates a new QR Code with the given version number,
        // error correction level, data codeword bytes, and mask number.
        // This is a low-level API that most users should not use directly.
        // A mid-level API is the encodeSegments() function.
        constructor(
        // The version number of this QR Code, which is between 1 and 40 (inclusive).
        // This determines the size of this barcode.
        version, 
        // The error correction level used in this QR Code.
        errorCorrectionLevel, dataCodewords, msk) {
            this.version = version;
            this.errorCorrectionLevel = errorCorrectionLevel;
            // The modules of this QR Code (false = light, true = dark).
            // Immutable after constructor finishes. Accessed through getModule().
            this.modules = [];
            // Indicates function modules that are not subjected to masking. Discarded when constructor finishes.
            this.isFunction = [];
            // Check scalar arguments
            if (version < QrCode.MIN_VERSION || version > QrCode.MAX_VERSION)
                throw new RangeError("Version value out of range");
            if (msk < -1 || msk > 7)
                throw new RangeError("Mask value out of range");
            this.size = version * 4 + 17;
            // Initialize both grids to be size*size arrays of Boolean false
            let row = [];
            for (let i = 0; i < this.size; i++)
                row.push(false);
            for (let i = 0; i < this.size; i++) {
                this.modules.push(row.slice()); // Initially all light
                this.isFunction.push(row.slice());
            }
            // Compute ECC, draw modules
            this.drawFunctionPatterns();
            const allCodewords = this.addEccAndInterleave(dataCodewords);
            this.drawCodewords(allCodewords);
            // Do masking
            if (msk == -1) { // Automatically choose best mask
                let minPenalty = 1000000000;
                for (let i = 0; i < 8; i++) {
                    this.applyMask(i);
                    this.drawFormatBits(i);
                    const penalty = this.getPenaltyScore();
                    if (penalty < minPenalty) {
                        msk = i;
                        minPenalty = penalty;
                    }
                    this.applyMask(i); // Undoes the mask due to XOR
                }
            }
            assert(0 <= msk && msk <= 7);
            this.mask = msk;
            this.applyMask(msk); // Apply the final choice of mask
            this.drawFormatBits(msk); // Overwrite old format bits
            this.isFunction = [];
        }
        /*-- Static factory functions (high level) --*/
        // Returns a QR Code representing the given Unicode text string at the given error correction level.
        // As a conservative upper bound, this function is guaranteed to succeed for strings that have 738 or fewer
        // Unicode code points (not UTF-16 code units) if the low error correction level is used. The smallest possible
        // QR Code version is automatically chosen for the output. The ECC level of the result may be higher than the
        // ecl argument if it can be done without increasing the version.
        static encodeText(text, ecl) {
            const segs = qrcodegen.QrSegment.makeSegments(text);
            return QrCode.encodeSegments(segs, ecl);
        }
        // Returns a QR Code representing the given binary data at the given error correction level.
        // This function always encodes using the binary segment mode, not any text mode. The maximum number of
        // bytes allowed is 2953. The smallest possible QR Code version is automatically chosen for the output.
        // The ECC level of the result may be higher than the ecl argument if it can be done without increasing the version.
        static encodeBinary(data, ecl) {
            const seg = qrcodegen.QrSegment.makeBytes(data);
            return QrCode.encodeSegments([seg], ecl);
        }
        /*-- Static factory functions (mid level) --*/
        // Returns a QR Code representing the given segments with the given encoding parameters.
        // The smallest possible QR Code version within the given range is automatically
        // chosen for the output. Iff boostEcl is true, then the ECC level of the result
        // may be higher than the ecl argument if it can be done without increasing the
        // version. The mask number is either between 0 to 7 (inclusive) to force that
        // mask, or -1 to automatically choose an appropriate mask (which may be slow).
        // This function allows the user to create a custom sequence of segments that switches
        // between modes (such as alphanumeric and byte) to encode text in less space.
        // This is a mid-level API; the high-level API is encodeText() and encodeBinary().
        static encodeSegments(segs, ecl, minVersion = 1, maxVersion = 40, mask = -1, boostEcl = true) {
            if (!(QrCode.MIN_VERSION <= minVersion && minVersion <= maxVersion && maxVersion <= QrCode.MAX_VERSION)
                || mask < -1 || mask > 7)
                throw new RangeError("Invalid value");
            // Find the minimal version number to use
            let version;
            let dataUsedBits;
            for (version = minVersion;; version++) {
                const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8; // Number of data bits available
                const usedBits = QrSegment.getTotalBits(segs, version);
                if (usedBits <= dataCapacityBits) {
                    dataUsedBits = usedBits;
                    break; // This version number is found to be suitable
                }
                if (version >= maxVersion) // All versions in the range could not fit the given data
                    throw new RangeError("Data too long");
            }
            // Increase the error correction level while the data still fits in the current version number
            for (const newEcl of [QrCode.Ecc.MEDIUM, QrCode.Ecc.QUARTILE, QrCode.Ecc.HIGH]) { // From low to high
                if (boostEcl && dataUsedBits <= QrCode.getNumDataCodewords(version, newEcl) * 8)
                    ecl = newEcl;
            }
            // Concatenate all segments to create the data bit string
            let bb = [];
            for (const seg of segs) {
                appendBits(seg.mode.modeBits, 4, bb);
                appendBits(seg.numChars, seg.mode.numCharCountBits(version), bb);
                for (const b of seg.getData())
                    bb.push(b);
            }
            assert(bb.length == dataUsedBits);
            // Add terminator and pad up to a byte if applicable
            const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
            assert(bb.length <= dataCapacityBits);
            appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
            appendBits(0, (8 - bb.length % 8) % 8, bb);
            assert(bb.length % 8 == 0);
            // Pad with alternating bytes until data capacity is reached
            for (let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)
                appendBits(padByte, 8, bb);
            // Pack bits into bytes in big endian
            let dataCodewords = [];
            while (dataCodewords.length * 8 < bb.length)
                dataCodewords.push(0);
            bb.forEach((b, i) => dataCodewords[i >>> 3] |= b << (7 - (i & 7)));
            // Create the QR Code object
            return new QrCode(version, ecl, dataCodewords, mask);
        }
        /*-- Accessor methods --*/
        // Returns the color of the module (pixel) at the given coordinates, which is false
        // for light or true for dark. The top left corner has the coordinates (x=0, y=0).
        // If the given coordinates are out of bounds, then false (light) is returned.
        getModule(x, y) {
            return 0 <= x && x < this.size && 0 <= y && y < this.size && this.modules[y][x];
        }
        /*-- Private helper methods for constructor: Drawing function modules --*/
        // Reads this object's version field, and draws and marks all function modules.
        drawFunctionPatterns() {
            // Draw horizontal and vertical timing patterns
            for (let i = 0; i < this.size; i++) {
                this.setFunctionModule(6, i, i % 2 == 0);
                this.setFunctionModule(i, 6, i % 2 == 0);
            }
            // Draw 3 finder patterns (all corners except bottom right; overwrites some timing modules)
            this.drawFinderPattern(3, 3);
            this.drawFinderPattern(this.size - 4, 3);
            this.drawFinderPattern(3, this.size - 4);
            // Draw numerous alignment patterns
            const alignPatPos = this.getAlignmentPatternPositions();
            const numAlign = alignPatPos.length;
            for (let i = 0; i < numAlign; i++) {
                for (let j = 0; j < numAlign; j++) {
                    // Don't draw on the three finder corners
                    if (!(i == 0 && j == 0 || i == 0 && j == numAlign - 1 || i == numAlign - 1 && j == 0))
                        this.drawAlignmentPattern(alignPatPos[i], alignPatPos[j]);
                }
            }
            // Draw configuration data
            this.drawFormatBits(0); // Dummy mask value; overwritten later in the constructor
            this.drawVersion();
        }
        // Draws two copies of the format bits (with its own error correction code)
        // based on the given mask and this object's error correction level field.
        drawFormatBits(mask) {
            // Calculate error correction code and pack bits
            const data = this.errorCorrectionLevel.formatBits << 3 | mask; // errCorrLvl is uint2, mask is uint3
            let rem = data;
            for (let i = 0; i < 10; i++)
                rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            const bits = (data << 10 | rem) ^ 0x5412; // uint15
            assert(bits >>> 15 == 0);
            // Draw first copy
            for (let i = 0; i <= 5; i++)
                this.setFunctionModule(8, i, getBit(bits, i));
            this.setFunctionModule(8, 7, getBit(bits, 6));
            this.setFunctionModule(8, 8, getBit(bits, 7));
            this.setFunctionModule(7, 8, getBit(bits, 8));
            for (let i = 9; i < 15; i++)
                this.setFunctionModule(14 - i, 8, getBit(bits, i));
            // Draw second copy
            for (let i = 0; i < 8; i++)
                this.setFunctionModule(this.size - 1 - i, 8, getBit(bits, i));
            for (let i = 8; i < 15; i++)
                this.setFunctionModule(8, this.size - 15 + i, getBit(bits, i));

async function computeStats(){
  const[pur,roast,prod,sales,adj,cash,transf,ctypes]=await Promise.all([
    DB.list('purchases'),DB.list('roastings'),DB.list('productions'),DB.list('sales'),DB.list('adjustments'),DB.list('cash_entries'),DB.list('transformations'),DB.list('coffee_types')]);
  const st={};
  st.greenIn=pur.reduce((s,p)=>s+Number(p.qty_kg||0),0);
  st.greenUsed=roast.reduce((s,r)=>s+Number(r.green_in||0),0);
  st.roastedMade=roast.reduce((s,r)=>s+Number(r.roasted_out||0),0);
  st.roastedUsed=prod.reduce((s,p)=>s+Number(p.roasted_used||0),0);
  st.roastedUsedTransf=transf.reduce((s,t)=>s+Number(t.roasted_used||0),0);
  st.transfMade=transf.reduce((s,t)=>(t.lines||[]).reduce((a,l)=>a+Number(l.qty||0),0)+s,0);
  st.greenAdj=adj.filter(x=>x.level==='green').reduce((a,x)=>a+Number(x.qty||0),0);
  st.roastedAdj=adj.filter(x=>x.level==='roasted').reduce((a,x)=>a+Number(x.qty||0),0);
  st.greenStock=st.greenIn-st.greenUsed+st.greenAdj;
  st.roastedStock=st.roastedMade-st.roastedUsed-st.roastedUsedTransf+st.roastedAdj;
  st.roastYield=st.greenUsed>0?(100*st.roastedMade/st.greenUsed):0;
  st.transfYield=st.roastedUsedTransf>0?(100*st.transfMade/st.roastedUsedTransf):0;
  const made={},used={},adjT={};
  transf.forEach(t=>(t.lines||[]).forEach(l=>{const k=l.type_id||l.name;made[k]=(made[k]||0)+Number(l.qty||0);}));
  prod.forEach(p=>(p.type_lines||[]).forEach(l=>{const k=l.type_id||l.name;used[k]=(used[k]||0)+Number(l.qty||0);}));
  adj.filter(x=>x.level==='type').forEach(x=>{const k=x.type_id||x.name;adjT[k]=(adjT[k]||0)+Number(x.qty||0);});
  st.types=ctypes.map(t=>({id:t.id,name:t.name,active:t.active!==false,made:made[t.id]||0,used:used[t.id]||0,stock:(made[t.id]||0)-(used[t.id]||0)+(adjT[t.id]||0)}));
  st.salesTotal=sales.reduce((s,x)=>s+Number(x.total||0),0);
  st.salesToday=sales.filter(x=>x.date===todayISO()).reduce((s,x)=>s+Number(x.total||0),0);
  st.creditDue=sales.filter(x=>x.pay_mode==='credit'&&x.credit_status==='due').reduce((s,x)=>s+Number(x.total||0),0);
  st.bal={cash:0,momo:0};
  cash.forEach(c=>{const v=Number(c.amount||0);st.bal[c.account==='momo'?'momo':'cash']+=(c.type==='in'?v:-v);});
  const prods=await DB.list('products');
  st.products=prods.map(p=>{
    let made=0,sold=0,ret=0;
    prod.forEach(pr=>(pr.lines||[]).forEach(l=>{if(l.product_id===p.id||l.name===p.name)made+=Number(l.qty||0);}));
    sales.forEach(s=>(s.lines||[]).forEach(l=>{if(l.product_id===p.id||l.name===p.name)sold+=Number(l.qty||0);}));
    adj.forEach(a=>{if((a.product_id===p.id||a.name===p.name)&&a.level==='product')ret+=Number(a.qty||0);});
    return{id:p.id,name:p.name,price:Number(p.price||0),alert_min:Number(p.alert_min||0),made,sold,adjust:ret,stock:made-sold+ret};
  });
  const packs=await DB.list('packaging_items');const pent=await DB.list('packaging_entries');
  st.packaging=packs.map(it=>{let qin=0,qout=0,vin=0;
    pent.filter(e=>e.item_id===it.id).forEach(e=>{const q=Number(e.qty||0);if(e.type==='in'){qin+=q;vin+=q*Number(e.unit_cost||0);}else qout+=q;});
    const cmp=qin>0?vin/qin:0;const stock=qin-qout;
    return{id:it.id,name:it.name,unit:it.unit||'unité',in:qin,out:qout,stock:stock,cmp:cmp,value:Math.round(stock*cmp),alert_min:Number(it.alert_min||0)};});
  st.packagingValue=st.packaging.reduce((s2,x)=>s2+x.value,0);
  return st;
}

function topHtml(){

  const logoHtml='<div class="logo" data-logo>'+(SETS.company&&SETS.company.logo?'<img src="'+SETS.company.logo+'" style="width:100%;height:100%;object-fit:contain;border-radius:9px">':'☕')+'</div>';
  return '<div class="topwrap"><div class="top"><div class="brand">'+logoHtml+'<div>'+esc((SETS.company&&SETS.company.name)||'FKS Industrie')+'<span class="sub">Gestion de production — CaféPro</span></div></div><div class="spacer"></div>'+mode+(!navigator.onLine?'<span class="pill" style="background:var(--badbg);color:var(--bad)">📡 Hors ligne</span>':'')+(_installEvt?'<button class="btn sm ghost" onclick="App.install()">📥 Installer</button>':'')+'<div class="userchip">'+esc(S.user&&S.user.name||'')+(S.user&&S.user.role&&S.user.role!=='manager'?' <span class="pill">'+(ROLE_LBL[S.user.role]||'')+'</span>':'')+' <button class="btn sm sec" onclick="logout()">Quitter</button></div></div>'

}

function applyCfgFromUrl(){
  try{
    const h=(location.href||'');
    const q=(location.search||'').replace(/^\?/,'')||h.split('#')[0].split('?')[1]||'';
    if(!q)return false;
    const p={};q.split('&').forEach(kv=>{const i=kv.indexOf('=');if(i>0)p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
    if(!p.su||!p.sk)return false;
    if(CFG&&CFG.url)return false; /* ne remplace jamais une config existante */
    CFG={mode:'supabase',url:p.su,anon:p.sk};
    LS.set(CFG_KEY,JSON.stringify(CFG));
    return true;
  }catch(e){return false;}
}

async function dbCheckSilent(){try{
  if(CFG.mode!=='supabase'||!CFG.url||!CFG.anon)return;
  const p=await dbProbe();
  if(p.miss.length)toast('⚠️ '+p.miss.length+' table'+(p.miss.length>1?'s':'')+' manquante'+(p.miss.length>1?'s':'')+' dans Supabase — Réglages → 🔍 Vérifier la base','bad');
}catch(e){}}
async function dbProbe(){
  const H={apikey:CFG.anon,Authorization:'Bearer '+((SES&&SES.access_token)||CFG.anon)};
  const out={ok:[],miss:[],auth:0,err:[],net:0};
  for(const t of DB_TABLES){
    let r;
    try{r=await fetch(Supa.base()+'/rest/v1/'+t+'?select=*&limit=1',{headers:H});}
    catch(e){out.net++;continue;}
    if(r.ok){out.ok.push(t);continue;}
    if(r.status===404)out.miss.push(t);
    else if(r.status===401||r.status===403)out.auth++;
    else out.err.push(t+' (erreur '+r.status+')');
  }
  return out;
}
App.dbCheck=async()=>{
  if(CFG.mode!=='supabase'||!CFG.url||!CFG.anon){modal('Vérification de la base','<div class="alert al-info">Cette vérification concerne le <b>mode en ligne</b>. Connectez d\'abord Supabase avec le bouton voisin, puis relancez-la.</div>');return;}
  modal('Vérification de la base…','<div class="help">Test direct des '+DB_TABLES.length+' tables du projet Supabase…</div>');
  const p=await dbProbe();
  if(p.net===DB_TABLES.length){modal('Vérification impossible','<div class="alert al-bad">Projet <b>injoignable</b> : URL incorrecte, connexion internet coupée, ou projet Supabase <b>en pause</b> — les projets gratuits se mettent en pause après une semaine d\'inactivité ; relancez-le depuis la console Supabase (bouton Restore), puis refaites Ctrl+F5 ici.</div>');return;}
  if(p.auth===DB_TABLES.length){modal('Session expirée','<div class="alert al-bad">Votre session a expiré — <b>déconnectez-vous puis reconnectez-vous</b>, et relancez la vérification.</div>');return;}
  if(p.auth>0||p.err.length){modal('Accès refusé sur certaines tables','<div class="alert al-bad">'+(p.auth?'<b>Session à renouveler</b> ('+p.auth+' tables). ':'')+(p.err.length?esc(p.err.join(', ')):'')+'</div><div class="help" style="margin-top:8px">Déconnectez/reconnectez-vous. Si cela persiste, ré-exécutez schema.sql dans le SQL Editor (il réinstalle aussi les droits gestionnaire_full).</div>');return;}
  if(!p.miss.length){modal('Vérification de la base ✅','<div class="alert al-ok"><b>Base complète :</b> les '+DB_TABLES.length+' tables nécessaires répondent correctement.'+(p.net?(' ('+p.net+' injoignables — réseau instable, relancez si besoin)'):'')+'</div>');return;}
  const miss=p.miss;
  const sql=miss.map(t=>TABLE_DDL[t]+'\nalter table '+t+' enable row level security;\ndrop policy if exists "gestionnaire_full" on '+t+';\ncreate policy "gestionnaire_full" on '+t+' for all to authenticated using (true) with check (true);'+(POLICY_EXTRA[t]||'')).join('\n\n');
  modal(miss.length+' table'+(miss.length>1?'s':'')+' manquante'+(miss.length>1?'s':''),
    '<div class="alert al-bad"><b>'+miss.length+' table'+(miss.length>1?'s':'')+' manquante'+(miss.length>1?'s':'')+' :</b> '+miss.join(', ')+'.<br>C\'est ce qui fait échouer certains enregistrements (ex. ajustements).</div>'
    +'<div class="help" style="margin:8px 0">Copiez le SQL ci-dessous → console Supabase → <b>SQL Editor</b> → New query → <b>Run</b>. Revenez ensuite relancer la vérification.</div>'
    +'<textarea id="dbSql" readonly style="width:100%;height:140px;font-family:monospace;font-size:11px">'+esc(sql)+'</textarea>',
    '<button class="btn sec" onclick="closeModal()">Fermer</button><button class="btn" onclick=\'copyTxt($("#dbSql").value);toast("SQL copié — collez-le dans Supabase (SQL Editor)","ok")\'>📋 Copier le SQL manquant</button>');
};

function payPill(s){if(s.pay_mode==='credit')return s.credit_status==='due'?'<span class="badge b-wait">Crédit — à encaisser</span>':'<span class="badge b-ok">Crédit encaissé</span>';
  return s.pay_mode==='momo'?'<span class="badge b-info">Mobile Money</span>':'<span class="badge b-ok">Espèces</span>';}

/* ================= FILE DE VALIDATION ================= */
function pendSummary(p){
  const d=p.payload||{};
  if(p.source_type==='sales'){const ls=(d.lines||[]).map(l=>num(l.qty)+' '+l.name).join(' + ');
    return '<b>Vente</b> par '+esc(d.agent_name)+' — '+ls+' · <b>'+money(d.total)+'</b> · '+(d.pay_mode==='credit'?'à crédit ('+esc(d.client||'client')+')':(d.pay_mode==='momo'?'Mobile Money':'espèces'));}
  if(p.source_type==='roasting')return '<b>Torréfaction</b> — '+num2(d.green_in)+' kg verts → <b>'+num2(d.roasted_out)+' kg torréfiés</b> · perte '+num2(Number(d.green_in||0)-Number(d.roasted_out||0))+' kg';
  if(p.source_type==='production'){const ls=(d.lines||[]).map(l=>num(l.qty)+' '+l.name).join(' + ');
    return '<b>Conditionnement</b> — '+num2(d.roasted_used)+' kg torréfiés → <b>'+ls+'</b>';}
  if(p.source_type==='caisse')return '<b>Caisse</b> — '+(d.type==='in'?'entrée':'sortie')+' <b>'+money(d.amount)+'</b> · '+(d.account==='momo'?'Mobile Money':'espèces')+' · '+esc(d.label||'');
  return '<b>'+esc(p.source_type)+'</b>';
}
async function scValidation(){
  const list=(await DB.list('pending_entries')).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  const pend=list.filter(p=>p.status==='pending');
  const done=list.filter(p=>p.status!=='pending').slice(0,15);
  const m=$('#main');
  m.innerHTML='<div class="card"><h2>📥 Saisies à valider</h2>'
  +(pend.length?pend.map(p=>'<div style="border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px">'
    +'<div class="mut" style="font-size:12px">'+dFR((p.created_at||'').slice(0,10))+' · reçu de '+esc(p.source_name||'lien')+'</div>'
    +'<div style="margin:6px 0 10px">'+pendSummary(p)+'</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm ok" onclick="App.pendOK(\''+p.id+'\')">✓ Valider</button>'
    +'<button class="btn sm danger" onclick="App.pendKO(\''+p.id+'\')">✕ Rejeter</button></div></div>').join('')
   :'<div class="empty"><span class="ic">✅</span>Aucune saisie en attente.<br><small>Les saisies envoyées via les liens (commerciaux, production, caisse) arrivent ici.</small></div>')
  +'</div>'
  +(done.length?'<div class="card"><h3>Traitées récemment</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Reçu le</th><th>Saisie</th><th>Statut</th></tr></thead><tbody>'
   +done.map(p=>'<tr><td>'+dFR((p.created_at||'').slice(0,10))+'</td><td>'+pendSummary(p)+'</td><td>'+(p.status==='validated'?'<span class="badge b-ok">Validée</span>':'<span class="badge b-no">Rejetée</span>')+'</td></tr>').join('')
   +'</tbody></table></div></div>':'');
}
App.pendOK=async id=>{
  const p=(await DB.list('pending_entries',{eq:{id:id}}))[0];if(!p)return;
  if(p.status!=='pending')return toast('Saisie déjà traitée','bad');
  try{
    await applyPending(p);
    await DB.update('pending_entries',id,{status:'validated',reviewed_at:nowISO()});
    toast('Saisie validée ✅','ok');
    if(p.source_type==='sales'){try{await afterSalesValidation((p.payload||{}).date);}catch(e){console.warn(e);}}
    render();
  }catch(e){toast('Erreur : '+e.message,'bad');}};
App.pendKO=async id=>{confirmBox('Rejeter cette saisie ?','La saisie sera marquée comme rejetée (archivée, sans effet sur les stocks ni la caisse).','Rejeter',async()=>{
  await DB.update('pending_entries',id,{status:'rejected',reviewed_at:nowISO()});toast('Saisie rejetée');render();});};
async function applyPending(p){
  const d=p.payload||{};
  if(p.source_type==='sales'){await createSale(Object.assign({},d,{source:'form'}));}
  else if(p.source_type==='roasting'){await DB.insert('roastings',{date:d.date,green_in:d.green_in,roasted_out:d.roasted_out,operator:d.operator||p.source_name||'',note:'',source:'form'});}
  else if(p.source_type==='production'){await createProduction({date:d.date,roasted_used:d.roasted_used||0,lines:d.lines||[],operator:d.operator||p.source_name||'',note:'',source:'form'});}
  else if(p.source_type==='transformation'){await DB.insert('transformations',{date:d.date,roasted_used:d.roasted_used,lines:d.lines||[],operator:d.operator||p.source_name||'',note:'',source:'form'});}
  else if(p.source_type==='caisse'){await createCashEntry({date:d.date,type:d.type,account:d.account,category:d.category,label:d.label,amount:d.amount,imputable:d.imputable!==false,od:d.od||null,source:'form'});}
}

   +'<td class="r" style="white-space:nowrap"><button class="btn sm sec" onclick="App.prodForm(\''+p.id+'\')">Modifier</button> <button class="btn sm '+(p.active?'sec':'ok')+'" onclick="App.prodToggle(\''+p.id+'\')">'+(p.active?'Désactiver':'Réactiver')+'</button></td></tr>';}).join('')
  +'</tbody></table></div></div>'

  +'<div class="help" style="margin-bottom:10px">Ce que produisent les <b>machines</b> après torréfaction (moutures, grains, assemblages…). Le conditionnement pioche dans ces types selon la recette de chaque produit.</div>'
  +'<div class="tblwrap"><table class="tbl"><thead><tr><th>Type</th><th class="r">Produit par machines</th><th class="r">Conditionné</th><th class="r">Stock</th><th></th></tr></thead><tbody>'
  +(ctypes.length?ctypes.map(t=>{const ts=tstock[t.id]||{made:0,used:0,stock:0};
    return '<tr'+(t.active!==false?'':' style="opacity:.5"')+'><td><b>'+esc(t.name)+'</b></td><td class="r">'+num2(ts.made)+' kg</td><td class="r">'+num2(ts.used)+' kg</td><td class="r"><b>'+num2(ts.stock)+' kg</b></td>'

  +'</tbody></table></div></div>';

App.prodToggle=async id=>{const p=(await DB.list('products',{eq:{id:id}}))[0];await DB.update('products',id,{active:!p.active});render();};
App.prodForm=async id=>{
  let p={name:'',weight_g:500,price:0,alert_min:20,active:true,packaging:[]};
  if(id)p=(await DB.list('products',{eq:{id:id}}))[0]||p;
  const packs=(await DB.list('packaging_items')).filter(x=>x.active!==false);
  const ctypes=(await DB.list('coffee_types')).filter(x=>x.active!==false);
  const bom=p.packaging||[];
  const rec=(p.recipes||[])[0]||{};
  modal(id?'Modifier le produit':'Nouveau produit',
    fld('Nom du produit','<input id="pName" value="'+esc(p.name)+'" placeholder="ex : Café saveur cannelle 250 g">')
    +'<div class="row">'+fld('Poids (g) — informatif','<input id="pW" type="number" inputmode="numeric" value="'+(p.weight_g||'')+'">')+fld('Prix de vente (FCFA)','<input id="pP" type="number" inputmode="numeric" value="'+(p.price||'')+'">')+fld('Alerte stock bas','<input id="pA" type="number" inputmode="numeric" value="'+(p.alert_min||0)+'">')+'</div>'
    +(ctypes.length?'<div class="row">'+fld('Type de café (après machines)','<select id="pT">'+ctypes.map(t=>'<option value="'+t.id+'"'+((rec.type_id||p.type_id)===t.id?' selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select>')
      +fld('Kg de ce type par unité','<input id="pTk" type="number" step="0.01" min="0" inputmode="decimal" value="'+(rec.qty||p.type_kg||(p.weight_g?p.weight_g/1000:''))+'">')+'</div>'
      +'<div class="help" style="margin-bottom:10px">Au conditionnement, chaque unité produite consommera automatiquement cette quantité de ce type (+ les emballages ci-dessous).</div>':'')
    +'<div class="field"><span>Emballages consommés par unité produite (automatique à chaque conditionnement)</span>'
    +(packs.length?packs.map(k=>{const cur=bom.filter(b=>b.pack_id===k.id)[0];
      return '<div class="row" style="margin-bottom:6px"><span style="flex:1;font-size:13.5px">'+esc(k.name)+'</span><input style="max-width:110px" id="bom_'+k.id+'" type="number" inputmode="numeric" min="0" step="0.01" value="'+(cur?cur.qty:0)+'"></div>';}).join(''):'<div class="help">Créez d\'abord des articles dans l\'écran Emballages.</div>')
    +'</div>',
    '<button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="App.prodSave(\''+(id||'')+'\')">Enregistrer</button>');
};
App.prodSave=async id=>{const rec={name:$('#pName').value.trim(),weight_g:Number($('#pW').value)||0,price:Number($('#pP').value)||0,alert_min:Number($('#pA').value)||0};
  if(!rec.name)return toast('Nom obligatoire','bad');
  if($('#pT')){const tSel=$('#pT').value;const tk=Number($('#pTk').value)||0;
    const ctypes=await DB.list('coffee_types');
    const t=ctypes.filter(x=>x.id===tSel)[0];
    if(t&&tk>0){rec.type_id=t.id;rec.type_name=t.name;rec.type_kg=tk;rec.recipes=[{type_id:t.id,name:t.name,qty:tk}];}
    else{rec.type_id=null;rec.type_name=null;rec.type_kg=0;}}
  const packs=await DB.list('packaging_items');const bom=[];
  packs.forEach(k=>{const el=$('#bom_'+k.id);const q=el?Number(el.value)||0:0;if(q>0)bom.push({pack_id:k.id,name:k.name,qty:q});});
  rec.packaging=bom;
  if(id)await DB.update('products',id,rec);else await DB.insert('products',Object.assign({unit:'sachet',active:true},rec));
  closeModal();toast('Produit enregistré','ok');render();};
App.typeForm=async id=>{
  let t={name:'',alert_min:20};
  if(id)t=(await DB.list('coffee_types',{eq:{id:id}}))[0]||t;
  modal(id?'Modifier le type':'Nouveau type de café transformé',
    fld('Nom du type','<input id="tName" value="'+esc(t.name)+'" placeholder="ex : Moulu premium, Grains, Assemblage maison…">')
    +fld('Alerte stock bas (kg)','<input id="tAlert" type="number" inputmode="numeric" value="'+(t.alert_min||0)+'">'),
    '<button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="App.typeSave(\''+(id||'')+'\')">Enregistrer</button>');
};
App.typeSave=async id=>{const name=$('#tName').value.trim();if(!name)return toast('Nom obligatoire','bad');

  if(id)await DB.update('coffee_types',id,rec);else await DB.insert('coffee_types',Object.assign({active:true},rec));

App.typeToggle=async id=>{const t=(await DB.list('coffee_types',{eq:{id:id}}))[0];if(!t)return;

async function scAchats(){
  const list=(await DB.list('purchases')).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const cash=await DB.list('cash_entries');
  const totKg=list.reduce((s,p)=>s+Number(p.qty_kg||0),0),totAmt=list.reduce((s,p)=>s+Number(p.amount||0),0);
  $('#main').innerHTML='<div class="card"><h2>🛁 Achats de café vert<span class="spacer"></span><button class="btn sm" onclick="App.achatForm()">+ Nouvel achat</button></h2>'
  +'<div class="grid g3" style="margin-bottom:12px"><div class="kpi"><div class="t">Total acheté</div><div class="v">'+num2(totKg)+' kg</div></div><div class="kpi"><div class="t">Montant total</div><div class="v">'+money(totAmt)+'</div></div><div class="kpi"><div class="t">Prix moyen</div><div class="v">'+money(totKg?totAmt/totKg:0)+'/kg</div></div></div>'
  +'<div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Fournisseur</th><th class="r">Qté (kg)</th><th class="r">Prix/kg</th><th class="r">Montant</th><th>Règlement</th><th></th></tr></thead><tbody>'
  +list.map(p=>{const paid=cash.some(c=>c.ref==='purchase:'+p.id);
    return '<tr><td>'+dFR(p.date)+'</td><td>'+esc(p.supplier)+'</td><td class="r">'+num2(p.qty_kg)+'</td><td class="r">'+money(p.price_per_kg)+'</td><td class="r"><b>'+money(p.amount)+'</b></td><td>'+(paid?'<span class="badge b-ok">Payé</span>':'<span class="badge b-wait">Non payé</span>')+'</td>'
    +'<td class="r" style="white-space:nowrap">'+(paid?'':'<button class="btn sm ok" onclick="App.achatPay(\''+p.id+'\')">Marquer payé</button> ')+'<button class="btn sm sec" onclick="App.achatDel(\''+p.id+'\')">✕</button></td></tr>';}).join('')
  +'</tbody><tfoot><tr><td colspan="2">TOTAL</td><td class="r">'+num2(totKg)+' kg</td><td></td><td class="r">'+money(totAmt)+'</td><td></td><td></td></tr></tfoot></table></div></div>';
}
App.achatPay=async id=>{const p=(await DB.list('purchases',{eq:{id:id}}))[0];

App.condTot=()=>{const inputs=$$('input[id^=cq_]');let n=0;inputs.forEach(i=>n+=Number(i.value)||0);
  const ctx=App._condCtx||{};
  if(n>0&&ctx.hasTypes){
    const use={};const stock=ctx.stock||{};
    inputs.forEach(i=>{const q=Number(i.value)||0;if(q<=0)return;const p=(ctx.prods||[]).filter(x=>x.id===i.id.slice(3))[0];if(!p)return;
      (p.recipes||[]).forEach(r=>{use[r.type_id]=(use[r.type_id]||0)+Number(r.qty||0)*q;});});
    const parts=Object.keys(use).map(k=>{const t=(ctx.types||[]).filter(x=>x.id===k)[0];const nm=t?t.name:k;
      const st=stock[k]!=null?stock[k]:0;return num2(use[k])+' kg '+esc(nm)+(use[k]>st?' ⚠️ stock '+num2(st):'');});
    $('#cTot').innerHTML='<b>'+num(n)+'</b> unité(s) → consommera '+parts.join(' · ');

async function createProduction(rec){
  if(!rec.type_lines){
    const prods=await DB.list('products');const acc={};
    for(const l of (rec.lines||[])){const p=prods.filter(x=>x.id===l.product_id||x.name===l.name)[0];
      if(p&&(p.recipes||[]).length)(p.recipes).forEach(r=>{const k=r.type_id||r.name;acc[k]=(acc[k]||0)+Number(r.qty||0)*Number(l.qty||0);});}
    const ctypes=await DB.list('coffee_types');
    rec.type_lines=Object.keys(acc).map(k=>{const t=ctypes.filter(x=>x.id===k)[0];return{type_id:k,name:t?t.name:k,qty:Math.round(acc[k]*1000)/1000};});
  }
  const pr=await DB.insert('productions',Object.assign({created_at:nowISO()},rec));
  try{await consumePackagingForProduction(pr);}catch(e){console.warn('emballages',e);}
  return pr;
}
async function consumePackagingForProduction(pr){
  const prods=await DB.list('products');const packs=await DB.list('packaging_items');
  for(const l of (pr.lines||[])){
    const p=prods.filter(x=>x.id===l.product_id||x.name===l.name)[0];
    if(!p||!p.packaging||!p.packaging.length)continue;
    for(const need of p.packaging){
      const it=packs.filter(x=>x.id===need.pack_id)[0];if(!it)continue;
      const q=Number(need.qty||0)*Number(l.qty||0);if(q<=0)continue;
      await DB.insert('packaging_entries',{date:pr.date,type:'out',qty:q,unit_cost:0,amount:0,reason:'Production — '+p.name,ref:'production:'+pr.id,item_id:it.id,item_name:it.name,source:pr.source||'admin',status:'validated'});
    }
  }
}
App.condSave=async()=>{
  const ctx=App._condCtx||{};const hasTypes=!!ctx.hasTypes;
  const kg=hasTypes?0:(Number(($('#cKg')||{value:0}).value)||0);
  const prods=await DB.list('products');
  const lines=[];$$('input[id^=cq_]').forEach(i=>{const q=Number(i.value)||0;if(q>0){const p=prods.filter(x=>x.id===i.id.slice(3))[0];if(p)lines.push({product_id:p.id,name:p.name,qty:q,price:Number(p.price)||0});}});
  if(!lines.length)return toast('Choisissez au moins un produit produit','bad');
  if(!hasTypes&&!kg)return toast('Indiquez les kg de torréfié consommés','bad');
  if(hasTypes){
    const use={};lines.forEach(l=>{const p=prods.filter(x=>x.id===l.product_id)[0];(p&&p.recipes||[]).forEach(r=>use[r.type_id]=(use[r.type_id]||0)+Number(r.qty||0)*l.qty);});
    const ctypes=await DB.list('coffee_types');const stock=ctx.stock||{};
    const short=Object.keys(use).filter(k=>use[k]>(stock[k]!=null?stock[k]:Infinity));
    if(short.length){const nm=short.map(k=>{const t=ctypes.filter(x=>x.id===k)[0];return t?t.name:'?';}).join(', ');return toast('Stock insuffisant de : '+nm+' — enregistrez d\'abord une transformation','bad');}
  }
  await createProduction({date:$('#cD').value||todayISO(),roasted_used:kg,lines:lines,operator:$('#cOp').value,note:'',source:'admin'});
  toast('Conditionnement enregistré ✅ ('+(hasTypes?'types de café et ':'' )+'emballages consommés automatiquement)','ok');render();};
async function prodHistTab(){
  const roast=(await DB.list('roastings')).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const prod=(await DB.list('productions')).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const transf=(await DB.list('transformations')).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const tin=roast.reduce((s,r)=>s+Number(r.green_in||0),0),tout=roast.reduce((s,r)=>s+Number(r.roasted_out||0),0);
  const used=prod.reduce((s,p)=>s+Number(p.roasted_used||0),0),units=prod.reduce((s,p)=>s+(p.lines||[]).reduce((x,l)=>x+Number(l.qty||0),0),0);
  const tUsed=transf.reduce((s,t)=>s+Number(t.roasted_used||0),0),tOut=transf.reduce((s,t)=>(t.lines||[]).reduce((x,l)=>x+Number(l.qty||0),0)+s,0);
  const pUsedTypes=prod.reduce((s,p)=>(p.type_lines||[]).reduce((x,l)=>x+Number(l.qty||0),0)+s,0);
  return '<div class="grid g3" style="margin-bottom:12px">'
  +'<div class="kpi"><div class="t">Rendement torréfaction</div><div class="v">'+num2(tin?100*tout/tin:0)+' %</div><div class="s">'+num2(tout)+' kg obtenus / '+num2(tin)+' kg verts</div></div>'
  +'<div class="kpi"><div class="t">Kg torréfiés conditionnés</div><div class="v">'+num2(used)+' kg</div></div>'
  +'<div class="kpi"><div class="t">Unités produites</div><div class="v">'+num(units)+'</div><div class="s">'+num2(units?(used+pUsedTypes)/units:0)+' kg par unité</div></div>'
  +'<div class="kpi"><div class="t">Rendement machines</div><div class="v">'+num2(tUsed?100*tOut/tUsed:0)+' %</div><div class="s">'+num2(tOut)+' kg obtenus / '+num2(tUsed)+' kg torréfiés</div></div></div>'
  +(transf.length?'<h3>⚙️ Transformations (machines)</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th class="r">Torréfié utilisé (kg)</th><th>Types obtenus</th><th class="r">Perte</th><th class="r">Rendement</th><th>Opérateur</th><th></th></tr></thead><tbody>'
   +transf.map(t=>'<tr><td>'+dFR(t.date)+'</td><td class="r">'+num2(t.roasted_used)+'</td><td>'+(t.lines||[]).map(l=>num2(l.qty)+' kg '+esc(l.name)).join('<br>')+'</td><td class="r">'+num2(Number(t.roasted_used)-(t.lines||[]).reduce((a,l)=>a+Number(l.qty||0),0))+'</td><td class="r"><b>'+(Number(t.roasted_used)>0?num2(100*(t.lines||[]).reduce((a,l)=>a+Number(l.qty||0),0)/t.roasted_used)+' %':'—')+'</b></td><td>'+esc(t.operator||'')+'</td><td><button class="btn sm sec" onclick="App.delRow(\'transformations\',\''+t.id+'\')">✕</button></td></tr>').join('')
   +'</tbody></table></div><div style="height:16px"></div>':'')
  +'<h3>🔥 Torréfactions</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th class="r">Vert (kg)</th><th class="r">Torréfié (kg)</th><th class="r">Perte</th><th class="r">Rendement</th><th>Opérateur</th><th></th></tr></thead><tbody>'
  +roast.map(r=>'<tr><td>'+dFR(r.date)+'</td><td class="r">'+num2(r.green_in)+'</td><td class="r">'+num2(r.roasted_out)+'</td><td class="r">'+num2(Number(r.green_in)-Number(r.roasted_out))+'</td><td class="r"><b>'+num2(100*r.roasted_out/r.green_in)+' %</b></td><td>'+esc(r.operator||'')+'</td><td><button class="btn sm sec" onclick="App.delRow(\'roastings\',\''+r.id+'\')">✕</button></td></tr>').join('')
  +'</tbody></table></div><div style="height:16px"></div><h3>📦 Conditionnements</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th class="r">Matière consommée</th><th>Production</th><th>Opérateur</th><th></th></tr></thead><tbody>'
  +prod.map(p=>'<tr><td>'+dFR(p.date)+'</td><td class="r">'+(Number(p.roasted_used)>0?num2(p.roasted_used)+' kg torréfié':((p.type_lines||[]).map(l=>num2(l.qty)+' kg '+esc(l.name)).join('<br>')||'—'))+'</td><td>'+ (p.lines||[]).map(l=>num(l.qty)+' '+esc(l.name)).join('<br>')+'</td><td>'+esc(p.operator||'')+'</td><td><button class="btn sm sec" onclick="App.delRow(\'productions\',\''+p.id+'\')">✕</button></td></tr>').join('')
  +'</tbody></table></div>';
}
App.delRow=(t,id)=>confirmBox('Supprimer cet enregistrement ?','Les stocks seront recalculés d\'autant. Action définitive.','Supprimer',async()=>{
  if(t==='productions'){const ents=await DB.list('packaging_entries');for(const e of ents.filter(x=>x.ref==='production:'+id))await DB.remove('packaging_entries',e.id);}

App.adjSave=async()=>{const q=Number($('#jQ').value)||0;if(!q)return toast('Quantité obligatoire','bad');
  const lvl=$('#jL').value;let pid=null,pname=null;
  let tid=null;
  if(lvl==='product'){const sel=$('#jP select');pid=sel.value;pname=sel.options[sel.selectedIndex].text;}
  if(lvl==='type'&&$('#jT select')){const sel=$('#jT select');tid=sel.value;pname=sel.options[sel.selectedIndex].text;}
  await DB.insert('adjustments',{date:$('#jD').value||todayISO(),level:lvl,product_id:pid,type_id:tid,name:pname,qty:q,reason:$('#jR').value});
  toast('Ajustement enregistré','ok');render();};

/* ================= VENTES ================= */
async function scVentes(){
  const sales=(await DB.list('sales')).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const agents=await DB.list('sales_agents');
  const filter=S.venteFilter||{agent:'',from:'',to:''};
  const list=sales.filter(s=>(!filter.agent||s.agent_id===filter.agent)&&(!filter.from||s.date>=filter.from)&&(!filter.to||s.date<=filter.to));
  const tot=list.reduce((s,x)=>s+Number(x.total||0),0);
  const m=$('#main');
  m.innerHTML='<div class="card"><h2>🛒 Ventes<span class="spacer"></span><button class="btn sm" onclick="App.venteForm()">+ Nouvelle vente</button></h2>'
  +'<div class="row">'+fld('Commerciale','<select id="vfA" onchange="S.venteFilter.agent=this.value;render()"><option value="">Toutes</option>'+agents.map(a=>'<option value="'+a.id+'"'+(filter.agent===a.id?' selected':'')+'>'+esc(a.name)+'</option>').join('')+'</select>')
  +fld('Du','<input type="date" value="'+filter.from+'" onchange="S.venteFilter.from=this.value;render()">')+fld('Au','<input type="date" value="'+filter.to+'" onchange="S.venteFilter.to=this.value;render()">')+'</div>'
  +'<div class="pill" style="margin-bottom:10px">'+list.length+' vente(s) · <b>'+money(tot)+'</b></div>'
  +'<div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Commerciale</th><th>Produits</th><th class="r">Montant</th><th>Règlement</th><th></th></tr></thead><tbody>'
  +list.map(s=>'<tr><td>'+dFR(s.date)+'</td><td>'+esc(s.agent_name)+'</td><td class="mut">'+(s.lines||[]).map(l=>num(l.qty)+' '+esc(l.name)).join('<br>')+'</td><td class="r"><b>'+money(s.total)+'</b></td><td>'+payPill(s)+'</td>'
   +'<td><button class="btn sm sec" onclick="App.venteDel(\''+s.id+'\')">✕</button></td></tr>').join('')
  +'</tbody></table></div></div>';
}
App.venteDel=id=>confirmBox('Supprimer cette vente ?','Le stock de produits et la caisse seront recalculés. Action définitive.','Supprimer',async()=>{
  const s=(await DB.list('sales',{eq:{id:id}}))[0];
  const cash=await DB.list('cash_entries',{eq:{ref:'sale:'+id}});
  for(const c of cash)await DB.remove('cash_entries',c.id);
  await DB.remove('sales',id);toast('Vente supprimée');render();});
App.venteForm=async()=>{
  const agents=(await DB.list('sales_agents')).filter(a=>a.active);
  const prods=(await DB.list('products')).filter(p=>p.active);
  modal('Nouvelle vente',
    '<div class="row">'+fld('Date','<input id="vD" type="date" value="'+todayISO()+'">')+fld('Commerciale','<select id="vA">'+agents.map(a=>'<option value="'+a.id+'|'+esc(a.name)+'">'+esc(a.name)+'</option>').join('')+'<option value="|Vente directe">Vente directe (magasin)</option></select>')+'</div>'
    +'<div class="field"><span>Règlement</span><div class="toggle" id="vM"><button type="button" class="on in" onclick="App.payMode(this,\'cash\')">💵 Espèces</button><button type="button" onclick="App.payMode(this,\'momo\')">📱 Mobile Money</button><button type="button" onclick="App.payMode(this,\'credit\')">🧾 À crédit</button></div></div>'
    +'<div class="field" id="vCli" style="display:none"><span>Nom du client (crédit)</span><input id="vClient" placeholder="ex : Hôtel Ivoire Café"></div>'
    +'<div class="field"><span>Produits</span><div id="vLines"></div><button class="btn sm sec" onclick="App.venteLine()">+ Ajouter une ligne</button></div>'
    +'<div class="pill" id="vTot">Total : 0 F</div>',
    '<button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="App.venteSave()">Enregistrer la vente</button>');

};
App.payMode=(btn,v)=>{$$('#vM button').forEach(b=>b.className='');btn.className='on '+v;App._pay=v;$('#vCli').style.display=v==='credit'?'block':'none';};
App.venteLine=()=>{const prods=App._prods||[];const d=document.createElement('div');d.className='linerow';
  d.innerHTML='<select class="lp">'+prods.map(p=>'<option value="'+p.id+'|'+esc(p.name)+'|'+(p.price||0)+'">'+esc(p.name)+'</option>').join('')+'</select>'
  +'<input class="lq" type="number" min="0" value="1" inputmode="numeric" oninput="App.venteTot()">'
  +'<input class="lp2" type="number" min="0" inputmode="numeric" oninput="App.venteTot()">'
  +'<div class="amt"></div><button class="btn sm sec" onclick="this.parentNode.remove();App.venteTot()">✕</button>';
  const sel=d.querySelector('.lp');d.querySelector('.lp2').value=sel.value.split('|')[2];
  $('#vLines').appendChild(d);App.venteTot();};
App.venteTot=()=>{let t=0;$$('#vLines .linerow').forEach(r=>{const q=Number(r.querySelector('.lq').value)||0,p=Number(r.querySelector('.lp2').value)||0;t+=q*p;r.querySelector('.amt').textContent=money(q*p);});$('#vTot').innerHTML='Total : <b>'+money(t)+'</b>';};
App.venteSave=async()=>{
  const lines=[];$$('#vLines .linerow').forEach(r=>{const q=Number(r.querySelector('.lq').value)||0;if(q>0){const[pid,nm]=r.querySelector('.lp').value.split('|');lines.push({product_id:pid,name:nm,qty:q,price:Number(r.querySelector('.lp2').value)||0});}});
  if(!lines.length)return toast('Ajoutez au moins un produit','bad');
  const total=lines.reduce((s,l)=>s+l.qty*l.price,0);
  const[aid,aname]=$('#vA').value.split('|');
  await createSale({date:$('#vD').value||todayISO(),agent_id:aid,agent_name:aname,pay_mode:App._pay,client:$('#vClient')?$('#vClient').value:'',total,lines,source:'admin'});
  closeModal();toast('Vente enregistrée ✅','ok');render();};

App.linkModal=(token,name)=>{

App.tokenModal=async t=>{
  let tk=(await DB.list('form_tokens')).filter(x=>x.type===t&&x.active)[0];

    '<div style="text-align:center;margin-bottom:10px">'+qrSvg(url,210)+'</div>'

    +'<button class="btn sm sec" onclick="App.tokenReset(\''+t+'\')">↻ Régénérer (coupe l\'ancien lien)</button></div>');
};
App.tokenReset=async t=>{const tks=await DB.list('form_tokens');for(const x of tks.filter(x=>x.type===t))await DB.update('form_tokens',x.id,{active:false});
  await DB.insert('form_tokens',{type:t,name:t==='production'?'Atelier production':'Caisse',token:rndToken(),active:true});
  closeModal();toast('Nouveau lien généré','ok');render();};

  +sales.map(s=>'<tr><td>'+dFR(s.date)+'</td><td>'+esc(s.client||'—')+'</td><td>'+esc(s.agent_name)+'</td><td class="r"><b>'+money(s.total)+'</b></td>'
   +'<td>'+(s.credit_status==='due'?'<span class="badge b-wait">À encaisser</span>':'<span class="badge b-ok">Encaissé'+(s.paid_date?' le '+dFR(s.paid_date):'')+'</span>')+'</td>'
   +'<td>'+(s.credit_status==='due'?'<button class="btn sm ok" onclick="App.encaisser(\''+s.id+'\')">💵 Encaisser</button>':'')+'</td></tr>').join('')

App.encaisser=id=>modal('Encaisser ce crédit','<div class="row">'+fld('Date de l\'encaissement','<input id="eD" type="date" value="'+todayISO()+'">')
  +fld('Reçu sur','<select id="eA"><option value="cash">💵 Espèces</option><option value="momo">📱 Mobile Money</option></select>')+'</div>',
  '<button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn ok" onclick="App.encaisserSave(\''+id+'\')">Encaisser</button>');
App.encaisserSave=async id=>{const s=(await DB.list('sales',{eq:{id:id}}))[0];

/* ================= PAIE ================= */
function irppCalc(taxable,brackets){
  let tax=0,prev=0;
  for(const b of(brackets||SETS.payroll.brackets)){
    const cap=(b.upTo==null?Infinity:b.upTo);
    if(taxable>prev)tax+=((Math.min(taxable,cap)-prev))*(Number(b.rate)||0)/100;
    prev=cap;if(taxable<=cap)break;
  }
  return Math.round(tax);
}
function computeSlip(emp,x,P){
  P=P||SETS.payroll;
  const abs=Number(x.absence_days||0),ot=Number(x.ot_hours||0),bonus=Number(x.bonus||0),other=Number(x.other||0),adv=Number(x.advances||0);
  const days=Number(x.days||0);
  let base=Number(emp.base_salary||0);
  if(emp.salary_type==='daily'&&days)base=base*days;
  const gross=base+Number(emp.transport||0)+Number(emp.housing||0)+bonus+ot*Number(x.ot_rate||0);
  const absDed=emp.salary_type==='daily'?0:Math.round(base*abs/(Number(P.day_basis)||30));
  const brutAP=Math.round(gross-absDed);
  const cnpsBase=Math.min(brutAP,Number(P.cnps_plafond_retraite)||0);
  const cnps=Math.round(cnpsBase*(Number(P.cnps_retraite_e)||0)/100);
  const cmu=Math.round((Number(P.cmu_forfait)||0)/2);
  const itsGross=irppCalc(brutAP,P.its_brackets);
  const demi=Number(emp.tax_shares!=null?emp.tax_shares:2)||0;
  const ricfRaw=Math.min((Number(P.ricf_par_demi_part)||0)*demi,Number(P.ricf_plafond)||0);
  const ricf=itsGross>0?ricfRaw:0;
  const its=Math.max(0,itsGross-ricf);
  const net=brutAP-cnps-cmu-its-other-adv;
  const plaf=Math.min(brutAP,Number(P.pf_plafond)||0),plafM=Math.min(brutAP,Number(P.mat_plafond)||0),plafA=Math.min(brutAP,Number(P.at_plafond)||0);
  const er={retraite:Math.round(cnpsBase*(Number(P.cnps_retraite_er)||0)/100),
    pf:Math.round(plaf*(Number(P.pf_rate)||0)/100),
    mat:Math.round(plafM*(Number(P.mat_rate)||0)/100),
    at:Math.round(plafA*(Number(P.at_rate)||0)/100),
    cmu:cmu,
    fdfp:Math.round(brutAP*((Number(P.fdfp_ta)||0)+(Number(P.fdfp_tfpc)||0))/100)};
  const cnpsEr=er.retraite+er.pf+er.mat+er.at+er.cmu;
  return{emp:emp,base:base,gross:Math.round(gross),absence_days:abs,abs_ded:absDed,brut_ap:brutAP,
    cnps_base:cnpsBase,cnps:cnps,cmu:cmu,its_gross:itsGross,ricf:ricf,its:its,taxable:brutAP,
    bonus:bonus,ot_hours:ot,other:other,advances:adv,net:Math.round(net),
    cnps_er:er.retraite,pf:er.pf,mat:er.mat,at:er.at,cmu_er:er.cmu,fdfp:er.fdfp,
    cnps_employer:cnpsEr,cout_employeur:brutAP+cnpsEr+er.fdfp};
}

  download(name,new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));}

App.expFilterRange=()=>{const f=S.expFilter||{};const to=f.to||todayISO();const from=f.from||'2000-01-01';return{from,to};};
App.expStocks=async()=>{
  const{from,to}=App.expFilterRange();
  const[pur,roast,prod,sales,adj,prods]=await Promise.all([DB.list('purchases'),DB.list('roastings'),DB.list('productions'),DB.list('sales'),DB.list('adjustments'),DB.list('products')]);
  const inR=x=>(!from||x.date>=from)&&(!to||x.date<=to);
  const st=await computeStats();
  const syn=[['POINT COMPLET DES STOCKS'],[esc((SETS.company&&SETS.company.name)||'')],['Période',dFR(from==='2000-01-01'?'':from)+' au '+dFR(to)],[],['NIVEAU','Entrées','Sorties','STOCK','Unité','Détail'],
    ['Café vert',num2(st.greenIn),num2(st.greenUsed),{v:num2(st.greenStock),__style:1},'kg','achats − torréfaction'+(st.greenAdj?(' · dont ajust. '+num2(st.greenAdj)):'')],
    ['Café torréfié',num2(st.roastedMade),num2(st.roastedUsed+st.roastedUsedTransf),{v:num2(st.roastedStock),__style:1},'kg','torréfaction '+num2(st.roastYield)+'% · machines '+num2(st.transfYield)+'%']];
  (st.types||[]).forEach(t=>syn.push([t.name,num2(t.made),num2(t.used),{v:num2(t.stock),__style:1},'kg','café transformé (machines)']));
  prods.forEach(pp=>{const s2=st.products.filter(x=>x.id===pp.id)[0]||{made:0,sold:0,stock:0};syn.push([pp.name,num(s2.made),num(s2.sold),{v:num(s2.stock),__style:1},'unités','production − ventes'+(s2.adjust?(' + ajust '+num2(s2.adjust)):'')]);});
  syn.push([],['Rendement torréfaction moyen',num2(st.roastYield)+' %','('+num2(st.roastedMade)+' kg obtenus / '+num2(st.greenUsed)+' kg verts)']);
  const green=[['DATE','MOUVEMENT','QTÉ (kg)','SOLDE (kg)','DÉTAIL']];
  let g=0;
  pur.filter(inR).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{g+=Number(x.qty_kg);green.push([dFR(x.date),'Achat café vert',Number(x.qty_kg),Math.round(g*100)/100,x.supplier]);});
  roast.filter(inR).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{g-=Number(x.green_in);green.push([dFR(x.date),'Torréfaction (consommé)',-Number(x.green_in),Math.round(g*100)/100,x.operator||'']);});
  adj.filter(x=>x.level==='green'&&inR(x)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{g+=Number(x.qty);green.push([dFR(x.date),'Ajustement',Number(x.qty),Math.round(g*100)/100,x.reason||'']);});
  const rlist=roast.filter(inR).sort((a,b)=>a.date.localeCompare(b.date));
  const roastSh=[['DATE','VERT ENTRÉ (kg)','TORRÉFIÉ SORTI (kg)','PERTE (kg)','RENDEMENT','OPÉRATEUR']].concat(rlist.map(r=>[dFR(r.date),Number(r.green_in),Number(r.roasted_out),Math.round((r.green_in-r.roasted_out)*100)/100,Math.round(100*r.roasted_out/r.green_in*10)/10,r.operator||'']));
  const used=prod.filter(inR).reduce((s,x)=>s+Number(x.roasted_used||0),0),made=prod.filter(inR).reduce((s,x)=>s+(x.lines||[]).reduce((y,l)=>y+Number(l.qty||0),0),0);
  roastSh.push([{v:'TOTAL',__style:1},{v:rlist.reduce((s,r)=>s+Number(r.green_in),0),__style:1},{v:rlist.reduce((s,r)=>s+Number(r.roasted_out),0),__style:1},{v:rlist.reduce((s,r)=>s+Number(r.green_in-r.roasted_out),0),__style:1},{v:Math.round((rlist.length?100*rlist.reduce((s,r)=>s+Number(r.roasted_out),0)/rlist.reduce((s,r)=>s+Number(r.green_in),0):0)*10)/10,__style:1},'']);
  const prodsSh=[['PRODUIT','PRODUITS','VENDUS','AJUSTEMENTS','STOCK','PRIX','VALEUR STOCK']];
  st.products.forEach(s2=>prodsSh.push([s2.name,s2.made,s2.sold,s2.adjust,{v:s2.stock,__style:1},s2.price,s2.stock*s2.price]));
  const totVal=st.products.reduce((s,x)=>s+x.stock*x.price,0);
  prodsSh.push([{v:'TOTAL',__style:1},'','','','',{v:'Valeur',__style:1},{v:totVal,__style:1}]);
  const mv=[['DATE','PRODUIT','MOUVEMENT','QTÉ','ORIGINE']];
  prod.filter(inR).forEach(pp=>(pp.lines||[]).forEach(l=>mv.push([dFR(pp.date),l.name,'Production',Number(l.qty),pp.operator||''])));
  sales.filter(inR).forEach(s2=>(s2.lines||[]).forEach(l=>mv.push([dFR(s2.date),l.name,'Vente',-Number(l.qty),s2.agent_name])));
  adj.filter(x=>x.level==='product').forEach(x=>mv.push([dFR(x.date),x.name||'','Ajustement',Number(x.qty),x.reason||'']));
  mv.sort((a,b)=>String(a[0]).split('/').reverse().join('').localeCompare(String(b[0]).split('/').reverse().join('')));
  const packSh=[['EMBALLAGES — STOCKS AU '+dFR(to)],[],
    ['ARTICLE','UNITÉ','ENTRÉES','SORTIES','STOCK','COÛT MOYEN','VALEUR']];
  (st.packaging||[]).forEach(p=>packSh.push([p.name,p.unit,p.in,p.out,{v:p.stock,__style:1},Math.round(p.cmp),p.value]));
  const pkTot=(st.packaging||[]).reduce((a,x)=>a+x.value,0);
  packSh.push([{v:'TOTAL',__style:1},'','','','','',{v:pkTot,__style:1}]);
  const pke=(await DB.list('packaging_entries')).filter(e=>(!from||e.date>=from)&&(!to||e.date<=to)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const pkMv=[['DATE','ARTICLE','MOUVEMENT','QTÉ','COÛT UNIT.','MONTANT','MOTIF']];
  pke.forEach(e=>pkMv.push([dFR(e.date),e.item_name||'',e.type==='in'?'Entrée':'Sortie',Number(e.qty),Number(e.unit_cost||0),Number(e.amount||0),e.reason||'']));
  makeXlsx([
    {name:'Synthèse',rows:syn,widths:[28,14,14,14,10,40]},
    {name:'Café vert',rows:green,widths:[12,26,12,12,30]},
    {name:'Torréfaction',rows:roastSh,widths:[12,16,18,12,12,16]},
    {name:'Produits finis',rows:prodsSh,widths:[30,12,12,14,10,12,14]},
    {name:'Emballages',rows:packSh,widths:[26,12,12,12,10,14,14]},
    {name:'Mouvements produits',rows:mv,widths:[12,30,14,10,24]},
    {name:'Mouvements emballages',rows:pkMv,widths:[12,26,12,10,12,14,26]}],
    'Point_stocks_'+to+'.xlsx');
  toast('Point des stocks téléchargé ✅','ok');
};
const LBL6={VE:'Ventes',AC:'Achats',CA:'Caisse',BQ:'Banque/MoMo',PA:'Paie',OD:'Opérations diverses'};
App.expCaisse=async()=>{
  const{from,to}=App.expFilterRange();
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const J=(SETS.journals||{});
  const jl=k=>(J[k]||k);
  const DEF={clients:'411100',fournisseurs:'401100',personnel_net:'422000',personnel_avances:'421100',cnps:'431000',etat:'447200',fdfp:'641400',virement_interne:'585000'};
  const acc=k=>sagAcc(k)||DEF[k]||'';
  const [cash,sales,pur,runs,slips]=await Promise.all([DB.list('cash_entries'),DB.list('sales'),DB.list('purchases'),DB.list('pay_runs'),DB.list('pay_slips')]);
  const L={VE:[],AC:[],CA:[],BQ:[],PA:[],OD:[]};
  const push=(jr,dt,ct,lib,de,cr)=>{if(!de&&!cr)return;L[jr].push([dFR(dt),jl(jr),ct,lib,de||'',cr||'']);};
  const A=e=>e.account==='momo'?acc('treso_momo'):acc('treso_caisse');
  /* --- VE : toutes les ventes (comptant espèces/MoMo + crédit) --- */
  sales.filter(x=>inR(x.date)).forEach(x=>{
    const ct=x.pay_mode==='credit'?acc('clients'):(x.pay_mode==='momo'?acc('treso_momo'):acc('treso_caisse'));
    const lib='Vente '+(x.agent_name||'')+(x.client?' — '+x.client:'');
    push('VE',x.date,ct,lib,Number(x.total)||0,'');
    push('VE',x.date,acc('ventes'),lib,'',Number(x.total)||0);
  });
  /* --- PA : paies clôturées de la période --- */
  const closed={};runs.filter(r=>r.status==='closed'&&inR(String(r.paid_date||r.created_at||'').slice(0,10))).forEach(r=>closed[r.id]=r);
  const sl=slips.filter(x=>closed[x.run_id]);
  if(sl.length){
    const SUM=k=>sl.reduce((a,x)=>a+Number(x[k]||0),0);
    const brut=SUM('brut_ap');
    const pat=sl.reduce((a,x)=>a+Number(x.cnps_employer||0)+Number(x.cmu_er||0),0);
    const fdfp=SUM('fdfp');
    const org=SUM('cnps')+sl.reduce((a,x)=>a+Number(x.cnps_employer||0),0)+SUM('cmu')+SUM('cmu_er');
    const etat=SUM('its')+SUM('other')+fdfp;
    const net=SUM('net'),adv=SUM('advances');
    const dt=closed[sl[0].run_id].paid_date||sl[0].created_at;
    const lib='Paie '+ (sl[0].run_period||'');
    push('PA',dt,acc('salaires'),lib,brut,'');
    if(pat)push('PA',dt,acc('charges_sociales'),lib,pat,'');
    if(fdfp)push('PA',dt,acc('fdfp'),lib,fdfp,'');
    if(org)push('PA',dt,acc('cnps'),lib,'',org);
    if(etat)push('PA',dt,acc('etat'),lib,'',etat);
    if(adv)push('PA',dt,acc('personnel_avances'),lib,'',adv);
    if(net)push('PA',dt,acc('personnel_net'),lib,'',net);
  }
  /* --- CA / BQ / AC / OD depuis les écritures de caisse --- */
  const saleById={};sales.forEach(x=>saleById[x.id]=x);
  cash.filter(e=>inR(e.date)).forEach(e=>{
    const amt=Number(e.amount)||0,lib=e.label,d=e.date,cat=e.category;
    if(e.imputable===false){
      if(e.od==='transfer'){push('OD',d,acc('virement_interne'),lib,amt,'');push('OD',d,A(e),lib,'',amt);}
      else{push('OD',d,A(e),lib,amt,'');push('OD',d,acc('virement_interne'),lib,'',amt);}
      return;}
    if(cat==='ventes'){
      const ref=String(e.ref||'');
      const src=ref.indexOf('sale:')===0?saleById[ref.slice(5)]:null;
      if(src&&src.pay_mode==='credit'){const jr=e.account==='momo'?'BQ':'CA';
        push(jr,d,A(e),lib,amt,'');push(jr,d,acc('clients'),lib,'',amt);}
      return;}
    if(cat==='achat_vert'||cat==='emballages'){
      push('AC',d,sagAcc(cat)||'',lib,amt,'');push('AC',d,A(e),lib,'',amt);return;}
    if(cat==='salaires'){const jr=e.account==='momo'?'BQ':'CA';
      push(jr,d,acc('personnel_net'),lib,amt,'');push(jr,d,A(e),lib,'',amt);return;}
    if(cat==='apport'){push('OD',d,A(e),lib,amt,'');push('OD',d,sagAcc('apport')||'101000',lib,'',amt);return;}
    if(cat==='treso_caisse'||cat==='treso_momo'){
      push('OD',d,acc('virement_interne'),lib,amt,'');push('OD',d,A(e),lib,'',amt);return;}
    const jr=e.account==='momo'?'BQ':'CA';
    const cc=sagAcc(cat)||'';
    if(e.type==='in'){push(jr,d,A(e),lib,amt,'');push(jr,d,cc,lib,'',amt);}
    else{push(jr,d,cc,lib,amt,'');push(jr,d,A(e),lib,'',amt);}
  });
  /* --- achats non encore réglés → AC crédit fournisseurs --- */
  const paidPur={};cash.forEach(e=>{const r=String(e.ref||'');if(r.indexOf('purchase:')===0)paidPur[r.slice(9)]=1;});
  pur.filter(p=>inR(p.date)&&!paidPur[p.id]).forEach(p=>{
    const lib='Achat café vert — '+p.supplier+' (à crédit)';
    push('AC',p.date,sagAcc('achat_vert')||'',lib,Number(p.amount)||0,'');
    push('AC',p.date,acc('fournisseurs'),lib,'',Number(p.amount)||0);
  });
  /* --- feuilles --- */
  const HEAD=['DATE','JOURNAL','COMPTE','LIBELLÉ','DÉBIT','CRÉDIT'];
  const sheetOf=k=>{const rows=[['JOURNAL '+jl(k)+' — '+(SETS.company&&SETS.company.name||'')],[ 'Période : '+dFR(from==='2000-01-01'?'':from)+' au '+dFR(to) ],[],HEAD];
    let dd=0,cc2=0;L[k].forEach(r=>{rows.push(r);dd+=Number(r[4])||0;cc2+=Number(r[5])||0;});
    rows.push([{v:'TOTAL '+jl(k),__style:1},'', '', '',{v:Math.round(dd*100)/100,__style:1},{v:Math.round(cc2*100)/100,__style:1}]);
    return{rows:rows,tot:dd,totC:cc2,n:L[k].length};};
  const KS=['VE','AC','CA','BQ','PA','OD'];
  const SH={};KS.forEach(k=>SH[k]=sheetOf(k));
  const syn=[['EXPORT SAGE 100 — 6 JOURNAUX'],[esc((SETS.company&&SETS.company.name)||'')],['Période : '+dFR(from==='2000-01-01'?'':from)+' au '+dFR(to)],[],
    ['JOURNAL','Code','Écritures','Total DÉBIT','Total CRÉDIT','ÉQUILIBRE']];
  KS.forEach(k=>syn.push([{v:(LBL6[k]||k),__style:1},jl(k),SH[k].n,Math.round(SH[k].tot),Math.round(SH[k].totC),Math.abs(SH[k].tot-SH[k].totC)<0.01?'✔':'✘ ÉCART']));
  const gD=KS.reduce((a,k)=>a+SH[k].tot,0),gC=KS.reduce((a,k)=>a+SH[k].totC,0);
  syn.push([{v:'TOTAL GÉNÉRAL',__style:1},'',{v:'',__style:1},{v:Math.round(gD),__style:1},{v:Math.round(gC),__style:1},{v:Math.abs(gD-gC)<0.01?'✔':'✘',__style:1}]);
  const det=[['DATE','TYPE','CATÉGORIE','LIBELLÉ','MOYEN','ENTRÉE','SORTIE','JOURNAL SAGE']];
  cash.filter(e=>inR(e.date)).forEach(e=>{
    let jr='—';
    if(e.imputable===false)jr=jl('OD');
    else if(e.category==='ventes'){const ref=String(e.ref||'');const src=ref.indexOf('sale:')===0?saleById[ref.slice(5)]:null;jr=(src&&src.pay_mode==='credit')?(e.account==='momo'?jl('BQ'):jl('CA')):jl('VE');}
    else if(e.category==='achat_vert'||e.category==='emballages')jr=jl('AC');
    else if(e.category==='salaires')jr=e.account==='momo'?jl('BQ'):jl('CA');
    else if(e.category==='apport')jr=jl('OD');
    else jr=e.account==='momo'?jl('BQ'):jl('CA');
    det.push([dFR(e.date),e.type==='in'?'Entrée':'Sortie',catLabel(e.category),e.label,e.account==='momo'?'Mobile Money':'Espèces',e.type==='in'?Number(e.amount):'',e.type==='out'?Number(e.amount):'',jr]);});
  makeXlsx(
    [{name:'Synthèse',rows:syn,widths:[30,8,12,16,16,12]}]
    .concat(KS.map(k=>({name:jl(k)+' — '+LBL6[k],rows:SH[k].rows,widths:[12,9,12,44,14,14]})))
    .concat([{name:'Mouvements',rows:det,widths:[12,10,26,38,14,14,14,12]}]),
    'Sage_6_journaux_'+to+'.xlsx');
  const csv=[HEAD].concat(KS.reduce((a,k)=>a.concat(L[k]),[]));
  csv.push([{v:'TOTAL',__style:1},'','','',{v:Math.round(gD),__style:1},{v:Math.round(gC),__style:1}]);
  dlCsv('Sage_6_journaux_'+to+'.csv',csv);
  toast('Sage 6 journaux téléchargé (xlsx + csv) ✅ '+((Math.abs(gD-gC)<0.01)?'— équilibré ✔':'— ⚠️ ÉCART')) ;
};
App.expVentes=async()=>{
  const{from,to}=App.expFilterRange();
  const sales=(await DB.list('sales')).filter(s=>(!from||s.date>=from)&&(!to||s.date<=to)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const agents=await DB.list('sales_agents');
  const det=[['DATE','COMMERCIALE','PRODUIT','QTÉ','PRIX U.','MONTANT','RÈGLEMENT','CLIENT']];
  sales.forEach(s=>(s.lines||[]).forEach(l=>det.push([dFR(s.date),s.agent_name,l.name,Number(l.qty),Number(l.price),Number(l.qty)*Number(l.price),s.pay_mode==='credit'?'Crédit':(s.pay_mode==='momo'?'Mobile Money':'Espèces'),s.client||''])));
  const byAg=[['COMMERCIALE','VENTES','CA TOTAL','ESPÈCES','MOMO','CRÉDIT EN COURS']];
  const names=agents.map(a=>a.name).concat(sales.filter(s=>!agents.some(a=>a.id===s.agent_id)).map(s=>s.agent_name)).filter((v,i,arr)=>arr.indexOf(v)===i);
  names.forEach(n=>{const ss=sales.filter(s=>s.agent_name===n);
    byAg.push([n,ss.length,ss.reduce((s,x)=>s+Number(x.total||0),0),ss.filter(x=>x.pay_mode==='cash').reduce((s,x)=>s+Number(x.total||0),0),ss.filter(x=>x.pay_mode==='momo').reduce((s,x)=>s+Number(x.total||0),0),ss.filter(x=>x.pay_mode==='credit'&&x.credit_status==='due').reduce((s,x)=>s+Number(x.total||0),0)]);});
  const prods=await DB.list('products');
  const byPd=[['PRODUIT','QTÉ VENDUE','CA']];
  prods.forEach(p=>{let q=0,ca=0;sales.forEach(s=>(s.lines||[]).forEach(l=>{if(l.product_id===p.id||l.name===p.name){q+=Number(l.qty);ca+=Number(l.qty)*Number(l.price);}}));byPd.push([p.name,q,ca]);});
  makeXlsx([
    {name:'Ventes',rows:det,widths:[12,22,30,8,12,14,14,22]},
    {name:'Par commerciale',rows:byAg,widths:[22,10,14,14,14,16]},
    {name:'Par produit',rows:byPd,widths:[32,14,14]}],
    'Ventes_'+to+'.xlsx');
  toast('Export ventes téléchargé ✅','ok');
};
App.expPaie=async()=>{
  const period=S.payPeriod||monthISO();
  const run=(await DB.list('pay_runs',{eq:{period:period}}))[0];
  if(!run)return toast('Aucune paie générée pour '+monthLabel(period)+' (onglet Paie du mois)','bad');
  const slips=(await DB.list('pay_slips',{eq:{run_id:run.id}}));
  const j=[['JOURNAL DE PAIE — '+monthLabel(period)+'  (taux CI, réforme ITS 2024)'],[],['EMPLOYÉ','POSTE','BASE','PRIMES','PRIME PONCT.','BRUT','CNPS','CMU','ITS BRUT','RICF','ITS DÛ','AUTRES RET.','AVANCES','NET À PAYER','CHARGES PATRON.','FDFP','COÛT EMPLOYEUR']];
  slips.forEach(s=>j.push([s.employee_name,s.position||'',Number(s.base),Number(s.transport)+Number(s.housing),Number(s.bonus),Number(s.brut_ap),Number(s.cnps),Number(s.cmu||0),Number(s.its_gross||0),Number(s.ricf||0),{v:Number(s.its!=null?s.its:s.irpp),__style:1},Number(s.other),Number(s.advances),{v:Number(s.net),__style:1},Number(s.cnps_employer||0),Number(s.fdfp||0),{v:Number(s.cout_employeur||s.brut_ap),__style:1}]));
  j.push([{v:'TOTAL',__style:1},'',

App.impBackupPick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||typeof d!=='object')throw new Error('structure inattendue');App.impData=d;App.impPreview();}catch(e){toast('Sauvegarde illisible : '+e.message,'bad');}};
    rd.readAsText(f);};
  inp.click();};
App.impPreview=()=>{const d=App.impData;const TB=['settings','products','coffee_types','packaging_items','packaging_entries','purchases','roastings','transformations','productions','adjustments','assets','sales_agents','sales','cash_entries','employees','advances','pay_runs','pay_slips','pending_entries','form_tokens','email_log'];
  const tb=TB.filter(t=>Array.isArray(d[t]));
  if(!tb.length)return toast('Aucune donnée reconnue dans ce fichier','bad');
  confirmBox('Restaurer cette sauvegarde ?','Fichier du '+(d.exported_at?dFR(String(d.exported_at).slice(0,10)):'date inconnue')+' — contient '+tb.map(t=>d[t].length+' '+t).join(', ')+'. Les éléments déjà présents (même id) ne sont pas dupliqués ; les réglages sont remplacés.','Restaurer',()=>App.impGo(tb));};
App.impGo=async tb=>{const d=App.impData;let done=0,skipped=0;
  for(const t of tb){
    if(t==='settings'){for(const r of d[t]){if(!r||!r.key)continue;let v=r.value;try{v=(typeof v==='string')?JSON.parse(v):v;}catch(e){v=r.value;}await setSetting(r.key,v);}done+=d[t].length;continue;}
    const ex=new Set((await DB.list(t)).map(x=>String(x.id)));
    const rows=d[t].filter(x=>x&&x.id!==undefined&&!ex.has(String(x.id)));
    skipped+=d[t].length-rows.length;
    if(!rows.length)continue;
    if(CFG.mode==='supabase'){try{await Supa.req(t,null,'POST',rows,{Prefer:'resolution=merge-duplicates'});done+=rows.length;}catch(e){toast('Table '+t+' : '+e.message,'bad');}}
    else{for(const r of rows)await DB.insert(t,r);done+=rows.length;}
  }
  await loadSettings();render();
  toast('Restauration terminée : '+done+' élément(s) importés'+(skipped?', '+skipped+' déjà présents':''),'ok');};
